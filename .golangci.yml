version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - gatewaylab

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec
    - depguard
  settings:
    staticcheck:
      # Default set minus two stylistic quickfixes that only rewrite correct code.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1001", "-QF1003"]
    depguard:
      # Mirrors the direct-import allowlists in scripts/check-foundation.py.
      # check-foundation.py additionally checks transitive dependencies.
      rules:
        leaf-registry:
          files: ["**/internal/registry/**"]
          list-mode: lax
          deny:
            - pkg: gatewaylab/internal
              desc: "registry is the foundation layer and imports no other internal package; move shared types into registry instead of importing upwards"
        leaf-secrets:
          files: ["**/internal/secrets/**"]
          list-mode: lax
          deny:
            - pkg: gatewaylab/internal
              desc: "secrets is a leaf package and imports no other internal package; pass needed values in as parameters"
        leaf-procutil:
          files: ["**/internal/procutil/**"]
          list-mode: lax
          deny:
            - pkg: gatewaylab/internal
              desc: "procutil is a leaf package and imports no other internal package"
        leaf-input:
          files: ["**/internal/input/**"]
          list-mode: lax
          deny:
            - pkg: gatewaylab/internal
              desc: "input is a leaf package and imports no other internal package"
        leaf-jsonutil:
          files: ["**/internal/jsonutil/**"]
          list-mode: lax
          deny:
            - pkg: gatewaylab/internal
              desc: "jsonutil is a leaf package and imports no other internal package"
        leaf-mcputil:
          files: ["**/internal/mcputil/**"]
          list-mode: lax
          deny:
            - pkg: gatewaylab/internal
              desc: "mcputil is a leaf package and imports no other internal package"
        leaf-fault:
          files: ["**/internal/fault/**"]
          list-mode: lax
          deny:
            - pkg: gatewaylab/internal
              desc: "fault is a leaf package and imports no other internal package"
        leaf-retry:
          files: ["**/internal/retry/**"]
          list-mode: lax
          deny:
            - pkg: gatewaylab/internal
              desc: "retry is a leaf package and imports no other internal package"
        leaf-apitypes:
          files: ["**/internal/apitypes/**"]
          list-mode: lax
          deny:
            - pkg: gatewaylab/internal
              desc: "apitypes is the HTTP wire contract and imports no other internal package; convert domain values in internal/api"
        leaf-buildinfo:
          files: ["**/internal/buildinfo/**"]
          list-mode: lax
          deny:
            - pkg: gatewaylab/internal
              desc: "buildinfo is a leaf package and imports no other internal package"
        leaf-i18n:
          files: ["**/internal/i18n/**"]
          list-mode: lax
          deny:
            - pkg: gatewaylab/internal
              desc: "i18n is a leaf package and imports no other internal package"
        apiclient-layer:
          files: ["**/internal/apiclient/**"]
          list-mode: lax
          allow:
            - gatewaylab/internal/apitypes
          deny:
            - pkg: gatewaylab/internal
              desc: "apiclient is a leaf HTTP client over apitypes and must not import backend packages"
        workspace-layer:
          files: ["**/internal/workspace/**"]
          list-mode: lax
          allow:
            - gatewaylab/internal/buildinfo
          deny:
            - pkg: gatewaylab/internal
              desc: "workspace may only import buildinfo"
        clientconfig-layer:
          files: ["**/internal/clientconfig/**"]
          list-mode: lax
          allow:
            - gatewaylab/internal/buildinfo
            - gatewaylab/internal/i18n
          deny:
            - pkg: gatewaylab/internal
              desc: "clientconfig may only import buildinfo and i18n"
        clientplugin-layer:
          files: ["**/internal/clientplugin/**"]
          list-mode: lax
          allow:
            - gatewaylab/internal/buildinfo
            - gatewaylab/internal/clientconfig
            - gatewaylab/internal/clientplugin/github
            - gatewaylab/internal/i18n
            - gatewaylab/internal/workspace
          deny:
            - pkg: gatewaylab/internal
              desc: "clientplugin may only import local configuration, identity, i18n, workspace, and its GitHub transport"
        clientplugin-github-layer:
          files: ["**/internal/clientplugin/github/**"]
          list-mode: lax
          deny:
            - pkg: gatewaylab/internal
              desc: "plugin release GitHub transport has no domain dependencies"
        store-layer:
          files: ["**/internal/store/**"]
          list-mode: lax
          deny:
            - pkg: gatewaylab/internal/api
              desc: "store must not import api; api sits above the domain layers"
            - pkg: gatewaylab/internal/gateway
              desc: "store must not import gateway; gateway is the composition root"
            - pkg: gatewaylab/internal/routing
              desc: "store may only import registry"
            - pkg: gatewaylab/internal/upstream
              desc: "store may only import registry"
            - pkg: gatewaylab/internal/maintenance
              desc: "store may only import registry"
            - pkg: gatewaylab/internal/model
              desc: "store may only import registry"
        policy-pure:
          files: ["**/internal/policy/**"]
          list-mode: strict
          allow:
            - $gostd
          deny:
            - pkg: gatewaylab/internal
              desc: "policy accepts domain inputs and imports no other internal package"
            - pkg: database/sql
              desc: "policy must stay pure"
            - pkg: net/http
              desc: "policy must stay pure"
            - pkg: os$
              desc: "policy must stay pure"
            - pkg: log/slog
              desc: "policy must stay pure"
            - pkg: sync
              desc: "policy must stay pure"
        routing-pure:
          files: ["**/internal/routing/**"]
          list-mode: lax
          deny:
            - pkg: gatewaylab/internal/maintenance
              desc: "routing must stay pure: depend on routing.Client instead of importing maintenance"
            - pkg: gatewaylab/internal/upstream
              desc: "routing must stay pure: depend on routing.Client instead of importing upstream"
            - pkg: gatewaylab/internal/store
              desc: "routing must stay pure: take data through routing interfaces instead of importing store"
            - pkg: gatewaylab/internal/model
              desc: "routing must stay pure: depend on routing.Client instead of importing model"
            - pkg: gatewaylab/internal/api
              desc: "routing must not import api"
            - pkg: gatewaylab/internal/gateway
              desc: "routing must not import gateway"
        sandbox-isolated:
          files: ["**/internal/maintenance/sandbox/**"]
          list-mode: lax
          deny:
            - pkg: gatewaylab/internal/upstream
              desc: "sandbox must not depend on upstream; inject the needed capability from maintenance or gateway"
            - pkg: gatewaylab/internal/store
              desc: "sandbox may only import registry, procutil, input, secrets"
            - pkg: gatewaylab/internal/maintenance
              desc: "sandbox must not import its parent maintenance package; maintenance imports sandbox"
        only-cmd-imports-api:
          files:
            - "**/internal/**"
            - "!**/internal/api/**"
            - "!**/internal/apiclient/**"
          list-mode: lax
          deny:
            - pkg: gatewaylab/internal/api
              desc: "only cmd/* may import api; internal packages must depend downwards"
        only-api-cmd-import-gateway:
          files:
            - "**/internal/**"
            - "!**/internal/api/**"
            - "!**/internal/gateway/**"
          list-mode: lax
          deny:
            - pkg: gatewaylab/internal/gateway
              desc: "only api and cmd/* may import gateway; define an interface in your own package and let gateway implement it"
        apiclient-cmd-only:
          files:
            - "**/internal/**"
            - "!**/internal/apiclient/**"
          list-mode: lax
          deny:
            - pkg: gatewaylab/internal/apiclient
              desc: "only cmd/* may import apiclient; backend packages must not depend on the HTTP client"
        clientconfig-local-only:
          files:
            - "**/internal/**"
            - "!**/internal/clientconfig/**"
            - "!**/internal/clientplugin/**"
          list-mode: lax
          deny:
            - pkg: gatewaylab/internal/clientconfig
              desc: "clientconfig edits MCP client files on the user's own machine; backend packages and /api must not reach it"
            - pkg: gatewaylab/internal/clientplugin
              desc: "clientplugin installs plugins into MCP clients on the user's own machine; backend packages and /api must not reach it"
        # The desktop UI talks to the backend only through the /api HTTP
        # contract. It may import the wire types, typed apiclient, and the few
        # local-only packages listed; every other internal package is backend code.
        desktop-http-contract:
          files:
            - "**/cmd/gateway-desktop/**"
            - "!**/cmd/gateway-desktop/server.go"
          list-mode: lax
          allow:
            - gatewaylab/internal/apiclient
            - gatewaylab/internal/apitypes
            - gatewaylab/internal/buildinfo
            - gatewaylab/internal/clientconfig
            - gatewaylab/internal/clientplugin
            - gatewaylab/internal/i18n
          deny:
            - pkg: gatewaylab/internal
              desc: "the desktop UI reaches the backend only over HTTP: use gatewaylab/internal/apitypes and gatewaylab/internal/apiclient for calls; only server.go may import internal/api to host the backend"
        # server.go hosts the embedded backend; it opens it through api.Open
        # and never touches domain packages directly.
        desktop-host:
          files: ["**/cmd/gateway-desktop/server.go"]
          list-mode: lax
          allow:
            - gatewaylab/internal/api
            - gatewaylab/internal/buildinfo
          deny:
            - pkg: gatewaylab/internal
              desc: "server.go hosts the backend through api.Open and api.Instance; it must not import domain packages"
  exclusions:
    rules:
      # Tests create fixtures in t.TempDir(), shell out to git with literal
      # arguments, and use loopback servers; gosec's file-permission, subprocess
      # and path-taint rules do not model that and add only noise there.
      - path: _test\.go
        linters: [gosec]
      # Test setup/teardown is best effort; assertions cover the observable result.
      - path: _test\.go
        linters: [errcheck]
