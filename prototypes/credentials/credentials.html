<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>服务凭据</title><style>
:root{color-scheme:light dark;font:14px system-ui;background:light-dark(#f6f8fa,#1a1a1e);color:light-dark(#263447,#f4f4f5)}body{max-width:920px;margin:60px auto;padding:24px}section{padding:28px;border:1px solid #64748b55;border-radius:12px;background:light-dark(white,#232327)}h2{font-size:18px;margin-top:0}p,small{color:light-dark(#697586,#a1a1aa)}.row{display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid #64748b33}code{width:180px}input{flex:1;min-width:100px;padding:10px;border:1px solid #64748b55;border-radius:6px;background:transparent;color:inherit}button{padding:9px 14px;border:1px solid #64748b55;border-radius:6px;color:inherit;background:transparent;cursor:pointer}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.primary{background:#7468ff;color:white}#message{min-height:20px}select{padding:8px}#error{color:#de6060}
</style></head><body><h1>GitHub / 连接与认证配置</h1><section><h2>服务凭据</h2><p>凭据保存在系统钥匙串，重启后自动恢复；环境变量优先</p><div class="row"><code>GITHUB_TOKEN</code><input id="token" type="password" placeholder="输入新凭据，留空保留"><small id="status">未配置</small><button id="clear">清除</button></div><p id="error"></p><div class="actions"><select id="mode"><option>正常保存</option><option>钥匙串不可访问</option></select><button id="restart">模拟重启</button><button class="primary" id="save">保存凭据</button></div><p id="message" aria-live="polite"></p></section><script>
let saved=false;
const token=document.querySelector('#token'),status=document.querySelector('#status'),error=document.querySelector('#error'),message=document.querySelector('#message');
document.querySelector('#save').onclick=()=>{error.textContent='';if(!token.value)return;if(document.querySelector('#mode').selectedIndex){error.textContent='无法保存凭据，请解锁系统钥匙串并允许 MCP Gateway 访问后重试';return;}saved=true;token.value='';status.textContent='已保存';message.textContent='凭据已保存';};
document.querySelector('#clear').onclick=()=>{saved=false;token.value='';status.textContent='未配置';message.textContent='已清除保存的凭据';};
document.querySelector('#restart').onclick=()=>{token.value='';status.textContent=saved?'已保存':'未配置';message.textContent=saved?'重启后凭据已恢复':'重启后未配置凭据';};
</script></body></html>
