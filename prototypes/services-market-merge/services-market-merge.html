<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP Gateway — 服务与市场合并原型</title>
  <style>
    :root {
      --bg-canvas: #ffffff;
      --bg-surface: #ffffff;
      --bg-control: #ffffff;
      --bg-sidebar: #f8fafc;
      --bg-subtle: #f7f9fc;
      --bg-muted: #eef2f6;
      --bg-hover: #f3f6fa;
      --ink-strong: #111827;
      --ink-body: #374151;
      --ink-muted: #6b7280;
      --ink-faint: #9ca3af;
      --border: #e5e9f0;
      --divider: #edf1f6;
      --border-strong: #cbd5e1;
      --accent: #635bff;
      --accent-hover: #5248f5;
      --accent-pressed: #4338ca;
      --accent-soft: #f5f6ff;
      --accent-border: #d5d2ff;
      --success: #15803d;
      --success-dot: #16a34a;
      --success-bg: #dcfce7;
      --success-border: #bbf7d0;
      --warning: #b45309;
      --warning-dot: #d97706;
      --warning-bg: #fef3c7;
      --warning-border: #fde68a;
      --danger: #b91c1c;
      --danger-dot: #dc2626;
      --danger-bg: #fee2e2;
      --danger-border: #fecaca;
      --neutral: #475569;
      --neutral-bg: #f1f5f9;
      --neutral-border: #e2e8f0;
      --shadow-control: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-card: 0 2px 8px rgba(15, 23, 42, 0.04);
      --shadow-floating: 0 8px 24px rgba(15, 23, 42, 0.12);
      --shadow-modal: 0 16px 40px rgba(10, 37, 64, 0.22);
      --backdrop-modal: rgba(15, 23, 42, 0.38);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    }

    html[data-theme="dark"] {
      --bg-canvas: #1a1a1e;
      --bg-surface: #232327;
      --bg-control: #28282d;
      --bg-sidebar: #1a1a1e;
      --bg-subtle: #1c1c20;
      --bg-muted: #303037;
      --bg-hover: #2c2c33;
      --ink-strong: #f4f4f5;
      --ink-body: #d4d4d8;
      --ink-muted: #a1a1aa;
      --ink-faint: #71717a;
      --border: #303036;
      --divider: #2b2b31;
      --border-strong: #43434c;
      --accent: #7a73ff;
      --accent-hover: #8f89ff;
      --accent-pressed: #635bff;
      --accent-soft: #272546;
      --accent-border: #454185;
      --success: #4ade80;
      --success-dot: #22c55e;
      --success-bg: #132b20;
      --success-border: #1f503a;
      --warning: #fbbf24;
      --warning-dot: #f59e0b;
      --warning-bg: #2c2211;
      --warning-border: #564019;
      --danger: #f87171;
      --danger-dot: #ef4444;
      --danger-bg: #2e161a;
      --danger-border: #5c252c;
      --neutral: #a1a1aa;
      --neutral-bg: #2b2b30;
      --neutral-border: #383840;
      --shadow-control: 0 2px 6px rgba(0, 0, 0, 0.22);
      --shadow-card: 0 3px 10px rgba(0, 0, 0, 0.16);
      --shadow-floating: 0 8px 24px rgba(0, 0, 0, 0.36);
      --shadow-modal: 0 16px 40px rgba(0, 0, 0, 0.50);
      --backdrop-modal: rgba(0, 0, 0, 0.62);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: var(--sans);
      background: var(--bg-canvas);
      color: var(--ink-body);
      font-size: 13.5px;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 228px;
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .sidebar-top {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .traffic-lights {
      display: flex;
      gap: 7px;
      padding: 14px 16px 6px;
    }
    .tl { width: 11px; height: 11px; border-radius: 50%; }
    .tl.red { background: #ff5f57; }
    .tl.yellow { background: #febc2e; }
    .tl.green { background: #28c840; }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 14px 12px;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-strong);
      letter-spacing: -0.01em;
    }

    .nav-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px 16px;
    }
    .nav-group-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-faint);
      padding: 10px 8px 4px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 9px;
      border-radius: 7px;
      color: var(--ink-body);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 1px;
      transition: background 0.12s, color 0.12s;
      user-select: none;
    }
    .nav-item:hover {
      background: var(--bg-hover);
      color: var(--ink-strong);
    }
    .nav-item.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-icon {
      width: 15px;
      height: 15px;
      opacity: 0.78;
      flex-shrink: 0;
    }
    .nav-item.active .nav-icon {
      opacity: 1;
    }
    .nav-badge {
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--ink-muted);
    }
    .nav-badge.danger {
      color: var(--danger);
      background: var(--danger-bg);
      padding: 1px 6px;
      border-radius: 999px;
    }

    .sidebar-foot {
      border-top: 1px solid var(--border);
      padding: 12px 14px;
    }
    .endpoint-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .endpoint-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-body);
    }
    .dot-live {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success-dot);
    }
    .copy-link {
      font-size: 11.5px;
      color: var(--accent);
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      font-weight: 500;
    }
    .copy-link:hover { text-decoration: underline; }
    .endpoint-url {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main Workspace */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg-canvas);
      position: relative;
    }
    .topbar {
      height: 46px;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--bg-canvas);
    }
    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-muted);
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Prototype Naming Switcher Pill */
    .proto-switcher {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 2px 4px;
      font-size: 11.5px;
    }
    .proto-switcher-label {
      color: var(--ink-muted);
      padding: 0 6px;
      font-weight: 500;
    }
    .proto-opt {
      border: none;
      background: transparent;
      color: var(--ink-muted);
      padding: 3px 8px;
      border-radius: 5px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s;
    }
    .proto-opt:hover { color: var(--ink-strong); }
    .proto-opt.active {
      background: var(--bg-surface);
      color: var(--accent);
      font-weight: 600;
      box-shadow: var(--shadow-control);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 28px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-control);
      color: var(--ink-body);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: var(--shadow-control);
    }
    .icon-btn:hover { background: var(--bg-hover); color: var(--ink-strong); }

    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 22px 28px 40px;
    }
    .page-inner {
      max-width: 1060px;
      margin: 0 auto;
    }

    /* Page Header with Integrated Tabs */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    .page-header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .page-title {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
      color: var(--ink-strong);
      letter-spacing: -0.02em;
    }

    .seg-tabs {
      display: inline-flex;
      align-items: center;
      background: var(--bg-muted);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .seg-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: none;
      background: transparent;
      color: var(--ink-muted);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s;
    }
    .seg-tab:hover { color: var(--ink-strong); }
    .seg-tab.active {
      background: var(--bg-surface);
      color: var(--ink-strong);
      font-weight: 600;
      box-shadow: var(--shadow-control);
    }

    /* Split Primary Button */
    .split-btn-wrap {
      position: relative;
      display: inline-flex;
    }
    .btn-primary {
      height: 32px;
      padding: 0 13px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.12s;
    }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary.split-main {
      border-radius: 7px 0 0 7px;
    }
    .btn-primary.split-caret {
      border-radius: 0 7px 7px 0;
      padding: 0 8px;
      border-left: 1px solid rgba(255, 255, 255, 0.22);
    }
    .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      width: 196px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      box-shadow: var(--shadow-floating);
      padding: 5px;
      z-index: 40;
      display: none;
    }
    .dropdown-menu.open { display: block; }
    .dropdown-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border: none;
      background: transparent;
      color: var(--ink-body);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12.5px;
      cursor: pointer;
      text-align: left;
    }
    .dropdown-item:hover { background: var(--bg-hover); color: var(--ink-strong); }
    .dropdown-hint {
      font-size: 11px;
      color: var(--ink-faint);
    }

    /* Surface Card */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    .toolbar {
      padding: 12px 16px;
      border-bottom: 1px solid var(--divider);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .filter-pills {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .pill {
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .pill:hover { background: var(--bg-hover); color: var(--ink-strong); }
    .pill.active {
      background: var(--bg-muted);
      color: var(--ink-strong);
      font-weight: 600;
      border-color: var(--border);
    }
    .pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .search-box {
      position: relative;
      width: 260px;
      max-width: 100%;
    }
    .search-box input {
      width: 100%;
      height: 30px;
      padding: 0 10px 0 30px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      color: var(--ink-strong);
      font-size: 12.5px;
      outline: none;
    }
    .search-box input:focus {
      border-color: var(--accent);
      background: var(--bg-canvas);
    }
    .search-icon {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-faint);
      width: 14px;
      height: 14px;
      pointer-events: none;
    }

    /* Group Header & Service Rows */
    .group-header {
      padding: 7px 16px;
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--divider);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .service-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--divider);
      cursor: pointer;
      transition: background 0.1s;
    }
    .service-row:last-child { border-bottom: none; }
    .service-row:hover { background: var(--bg-hover); }
    .service-row.disabled { opacity: 0.62; }

    .row-left {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      min-width: 0;
      flex: 1;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-top: 6px;
      flex-shrink: 0;
    }
    .status-dot.ready { background: var(--success-dot); }
    .status-dot.needs-action { background: var(--danger-dot); }
    .status-dot.pending { background: var(--warning-dot); }
    .status-dot.disabled { background: var(--ink-faint); }

    .svc-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 11.5px;
      color: var(--ink-strong);
      flex-shrink: 0;
    }
    .row-main {
      min-width: 0;
      flex: 1;
    }
    .row-title-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .svc-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink-strong);
    }
    .svc-transport {
      font-size: 11.5px;
      color: var(--ink-muted);
    }
    .inline-status {
      font-size: 11.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .inline-status.danger { color: var(--danger); }
    .inline-status.warning { color: var(--warning); }
    .inline-status.ready { color: var(--success); }

    .row-sub {
      margin-top: 3px;
      font-size: 12px;
      color: var(--ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .row-sub.danger { color: var(--danger); font-family: var(--mono); font-size: 11.5px; }

    .row-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .meta-text {
      width: 72px;
      text-align: right;
      font-size: 12px;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .meta-write {
      width: 48px;
      text-align: right;
      font-size: 11.5px;
      color: var(--warning);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .btn-inline {
      height: 26px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-control);
      color: var(--ink-strong);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: var(--shadow-control);
    }
    .btn-inline:hover {
      border-color: var(--accent-border);
      color: var(--accent);
      background: var(--accent-soft);
    }
    .btn-inline.primary-outline {
      border-color: var(--danger-border);
      color: var(--danger);
      background: var(--danger-bg);
    }
    .btn-inline.primary-outline:hover {
      filter: brightness(0.97);
    }

    /* Small Toggle Switch */
    .switch {
      position: relative;
      width: 32px;
      height: 18px;
      border-radius: 999px;
      background: var(--border-strong);
      cursor: pointer;
      transition: background 0.15s;
      border: none;
      padding: 0;
      flex-shrink: 0;
    }
    .switch.on { background: var(--accent); }
    .switch-thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.15s;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .switch.on .switch-thumb { transform: translateX(14px); }

    /* Market Grid */
    .market-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .market-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    @media (max-width: 960px) {
      .market-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .market-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-card);
      transition: border-color 0.12s, box-shadow 0.12s;
    }
    .market-card:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-floating);
    }
    .mc-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .mc-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .mc-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink-strong);
    }
    .mc-publisher {
      font-size: 11.5px;
      color: var(--ink-muted);
      margin-top: 1px;
    }
    .mc-desc {
      font-size: 12.5px;
      color: var(--ink-body);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .mc-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 4px;
    }
    .mc-tags {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tag {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 5px;
      background: var(--neutral-bg);
      color: var(--neutral);
      border: 1px solid var(--neutral-border);
      font-weight: 500;
    }
    .tag.auth {
      background: var(--warning-bg);
      color: var(--warning);
      border-color: var(--warning-border);
    }
    .tag.free {
      background: var(--success-bg);
      color: var(--success);
      border-color: var(--success-border);
    }
    .btn-add-market {
      height: 27px;
      padding: 0 11px;
      border-radius: 6px;
      border: 1px solid var(--accent-border);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-add-market:hover {

        },
        {
          id: 'supabase',
          name: 'Supabase',
          abbr: 'SB',
          color: '#10b981',
          publisher: 'Supabase Official',
          category: '数据与观测',
          transport: 'MCP Stdio',
          authType: '需凭据',
          envKey: 'SUPABASE_ACCESS_TOKEN',
          desc: '数据库迁移、Edge Functions、Auth 与项目配置管理。'
        }
      ]
    };

    function setNaming(name, btn) {
      state.naming = name;
      document.querySelectorAll('.proto-opt').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('nav-services-label').textContent = name;
      document.getElementById('topbar-title').textContent = name;
      document.getElementById('main-page-title').textContent = name;
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-btn').textContent = isDark ? '深色模式' : '浅色模式';
    }

    function switchTab(tab) {
      state.activeTab = tab;
      document.getElementById('tab-installed').classList.toggle('active', tab === 'installed');
      document.getElementById('tab-market').classList.toggle('active', tab === 'market');
      document.getElementById('view-installed').style.display = tab === 'installed' ? 'block' : 'none';
      document.getElementById('view-market').style.display = tab === 'market' ? 'block' : 'none';
    }

    function showStub(title) {
      document.getElementById('page-services').style.display = 'none';
      document.getElementById('page-stub').style.display = 'block';
      document.getElementById('stub-title').textContent = title;
      document.getElementById('topbar-title').textContent = title;
    }

    function showMain() {
      document.getElementById('page-stub').style.display = 'none';
      document.getElementById('page-services').style.display = 'block';
      document.getElementById('topbar-title').textContent = state.naming;
    }

    function toggleAddMenu(e) {
      e.stopPropagation();
      document.getElementById('add-dropdown').classList.toggle('open');
    }
    document.addEventListener('click', () => {
      document.getElementById('add-dropdown').classList.remove('open');
    });

    function updateCounters() {
      const needsCount = state.services.filter(s => s.enabled && s.status === 'needs_action').length;
      const badge = document.getElementById('nav-services-badge');
      if (needsCount > 0) {
        badge.textContent = needsCount;
        badge.classList.add('danger');
      } else {
        badge.textContent = state.services.filter(s => s.enabled).length;
        badge.classList.remove('danger');
      }
    }

    function renderInstalled() {
      updateCounters();
      const counts = {
        all: state.services.length,
        needs_action: state.services.filter(s => s.enabled && s.status === 'needs_action').length,
        pending: state.services.filter(s => s.enabled && s.status === 'pending').length,
        ready: state.services.filter(s => s.enabled && s.status === 'ready').length,
        disabled: state.services.filter(s => !s.enabled).length
      };

      const filterDefs = [
        { key: 'all', label: '全部' },
        { key: 'needs_action', label: '需处理', dot: 'var(--danger-dot)' },
        { key: 'pending', label: '待验证', dot: 'var(--warning-dot)' },
        { key: 'ready', label: '就绪', dot: 'var(--success-dot)' },
        { key: 'disabled', label: '已停用', dot: 'var(--ink-faint)' }
      ];

      document.getElementById('status-filters').innerHTML = filterDefs.map(f => `
        <button class="pill ${state.installedFilter === f.key ? 'active' : ''}" onclick="state.installedFilter='${f.key}';renderInstalled()">
          ${f.dot ? `<span class="pill-dot" style="background:${f.dot};"></span>` : ''}
          <span>${f.label}</span>
          <span style="color:var(--ink-faint);font-variant-numeric:tabular-nums;">${counts[f.key]}</span>
        </button>
      `).join('');

      const q = document.getElementById('installed-search').value.trim().toLowerCase();
      const filtered = state.services.filter(s => {
        const effStatus = s.enabled ? s.status : 'disabled';
        if (state.installedFilter !== 'all' && effStatus !== state.installedFilter) return false;
        if (q) {
          const hay = `${s.name} ${s.id} ${s.reason} ${s.desc}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const groups = [
        { key: 'needs_action', title: '需处理' },
        { key: 'pending', title: '待验证' },
        { key: 'ready', title: '就绪' },
        { key: 'disabled', title: '已停用' }
      ];

      const container = document.getElementById('installed-list');
      if (filtered.length === 0) {
        container.innerHTML = `<div style="padding:36px;text-align:center;color:var(--ink-muted);">没有匹配的服务，可以前往 <button class="link-btn" onclick="switchTab('market')">服务市场</button> 浏览或添加。</div>`;
        return;
      }

      let html = '';
      groups.forEach(g => {
        const items = filtered.filter(s => (s.enabled ? s.status : 'disabled') === g.key);
        if (items.length === 0) return;
        html += `<div class="group-header"><span>${g.title}</span><span>${items.length}</span></div>`;
        items.forEach(s => {
          const eff = s.enabled ? s.status : 'disabled';
          const dotCls = eff === 'needs_action' ? 'needs-action' : eff;
          let actionBtn = '';
          if (eff === 'needs_action') {
            actionBtn = `<button class="btn-inline" onclick="event.stopPropagation();openCredModal('${s.id}')">填写凭据</button>`;
          } else if (eff === 'pending') {
            actionBtn = `<button class="btn-inline" onclick="event.stopPropagation();testConnection('${s.id}')">测试连接</button>`;
          }
          let subLine = `<div class="row-sub">${s.desc}</div>`;
          if (eff === 'needs_action') {
            const vars = s.reason.replace(/^缺少凭据:\s*/, '');
            subLine = `<div class="row-sub"><span class="inline-status danger">缺少凭据</span> · <span style="font-family:var(--mono);font-size:11.5px;color:var(--ink-muted);">${vars}</span></div>`;
          } else if (eff === 'pending') {
            subLine = `<div class="row-sub"><span class="inline-status warning">待验证</span> · ${s.reason}</div>`;
          }

          html += `
            <div class="service-row ${s.enabled ? '' : 'disabled'}" onclick="openDrawer('${s.id}')">
              <div class="row-left">
                <span class="status-dot ${dotCls}"></span>
                <div class="row-main">
                  <div class="row-title-line">
                    <span class="svc-name">${s.name}</span>
                    <span class="svc-transport">${s.transport}</span>
                  </div>
                  ${subLine}
                </div>
              </div>
              <div class="row-right">
                ${actionBtn}
                <span class="meta-write">${s.writableCount > 0 ? `${s.writableCount} 可写` : ''}</span>
                <span class="meta-text">${s.toolsActive}/${s.toolsTotal} 工具</span>
                <button class="switch ${s.enabled ? 'on' : ''}" onclick="event.stopPropagation();toggleService('${s.id}')" aria-label="切换启用">
                  <span class="switch-thumb"></span>
                </button>
              </div>
            </div>
          `;
        });
      });
      container.innerHTML = html;
    }

    function renderMarket() {
      const cats = ['all', '精选 SaaS', '开发与代码', '数据与观测', '效率协作'];
      document.getElementById('market-filters').innerHTML = cats.map(c => `
        <button class="pill ${state.marketCategory === c ? 'active' : ''}" onclick="state.marketCategory='${c}';renderMarket()">
          ${c === 'all' ? '全部' : c}
        </button>
      `).join('');

      const q = document.getElementById('market-search').value.trim().toLowerCase();
      const installedIds = new Set(state.services.map(s => s.id));
      const items = state.market.filter(m => {
        if (state.marketCategory !== 'all' && m.category !== state.marketCategory) return false;
        if (q && !`${m.name} ${m.publisher} ${m.desc} ${m.category}`.toLowerCase().includes(q)) return false;
        return true;
      });

      document.getElementById('market-grid').innerHTML = items.map(m => {
        const isInstalled = installedIds.has(m.id);
        const authCls = m.authType === '免凭据' ? 'free' : 'auth';
        return `
          <div class="market-card">
            <div>
              <div class="mc-head">
                <div class="mc-brand">
                  <div class="svc-icon" style="color:${m.color};">${m.abbr}</div>
                  <div>
                    <div class="mc-title">${m.name}</div>
                    <div class="mc-publisher">${m.publisher}</div>
                  </div>
                </div>
                ${isInstalled
                  ? `<button class="btn-added-market" onclick="jumpToInstalled('${m.id}')">✓ 已接入</button>`
                  : `<button class="btn-add-market" onclick="installFromMarket('${m.id}')">+ 添加</button>`
                }
              </div>
              <div class="mc-desc" style="margin-top:10px;">${m.desc}</div>
            </div>
            <div class="mc-foot">
              <div class="mc-tags">
                <span class="tag">${m.transport}</span>
                <span class="tag ${authCls}">${m.authType}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleService(id) {
      const svc = state.services.find(s => s.id === id);
      if (!svc) return;
      svc.enabled = !svc.enabled;
      renderInstalled();
      showToast(`${svc.name} 已${svc.enabled ? '启用' : '停用'}`);
    }

    function testConnection(id) {
      const svc = state.services.find(s => s.id === id);
      if (!svc) return;
      svc.status = 'ready';
      svc.reason = '';
      renderInstalled();
      showToast(`${svc.name} 连接检查通过，已就绪`);
    }

    function openCredModal(id) {
      const svc = state.services.find(s => s.id === id);
      if (!svc) return;
      document.getElementById('modal-title').textContent = `配置 ${svc.name} 凭据`;
      document.getElementById('modal-body').innerHTML = `
        <p style="margin:0 0 12px;font-size:12.5px;color:var(--ink-muted);">凭据将安全保存在本机系统钥匙串中，不写入配置文件。</p>
        <label class="field-label">${svc.envKey || 'API_TOKEN'}</label>
        <input class="input-ctrl" id="cred-input" type="password" placeholder="输入 ${svc.envKey || 'Token'}..." value="sk_demo_••••••••••••" />
      `;
      document.getElementById('modal-foot').innerHTML = `
        <button class="icon-btn" onclick="closeModal()">取消</button>
        <button class="btn-primary" style="border-radius:7px;" onclick="saveCred('${svc.id}')">保存并测试连接</button>
      `;
      document.getElementById('modal-backdrop').classList.add('open');
    }

    function saveCred(id) {
      const svc = state.services.find(s => s.id === id);
      if (svc) {
        svc.status = 'ready';
        svc.reason = '';
      }
      closeModal();
      renderInstalled();
      showToast(`${svc.name} 凭据已保存并就绪`);
    }

    function installFromMarket(marketId) {
      const m = state.market.find(x => x.id === marketId);
      if (!m) return;
      if (m.authType === '免凭据') {
        addMarketService(m, true);
        showToast(`已添加 ${m.name} 到已接入服务`, '去查看', () => {
          switchTab('installed');
        });
        return;
      }

      document.getElementById('modal-title').textContent = `添加 ${m.name}`;
      document.getElementById('modal-body').innerHTML = `
        <p style="margin:0 0 12px;font-size:12.5px;color:var(--ink-muted);">${m.desc}</p>
        <label class="field-label">${m.envKey}（${m.authType}）</label>
        <input class="input-ctrl" id="market-cred-input" type="password" placeholder="粘贴凭据即可立即就绪，或留空稍后配置..." />
      `;
      document.getElementById('modal-foot').innerHTML = `
        <button class="icon-btn" onclick="confirmMarketAdd('${m.id}', false)">先添加，稍后配置</button>
        <button class="btn-primary" style="border-radius:7px;" onclick="confirmMarketAdd('${m.id}', true)">添加并启用</button>
      `;
      document.getElementById('modal-backdrop').classList.add('open');
    }

    function confirmMarketAdd(marketId, withCred) {
      const m = state.market.find(x => x.id === marketId);
      if (!m) return;
      const val = document.getElementById('market-cred-input')?.value.trim();
      const readyNow = withCred && Boolean(val);
      addMarketService(m, readyNow);
      closeModal();
      showToast(
        readyNow ? `${m.name} 已添加并就绪` : `${m.name} 已添加（待补齐凭据）`,
        '查看已接入',
        () => switchTab('installed')
      );
    }

    function addMarketService(m, readyNow) {
      if (state.services.some(s => s.id === m.id)) return;
      state.services.unshift({
        id: m.id,
        name: m.name,
        abbr: m.abbr,
        color: m.color,
        transport: m.transport,
        status: readyNow ? 'ready' : 'needs_action',
        reason: readyNow ? '' : `缺少凭据: ${m.envKey}`,
        envKey: m.envKey,
        desc: m.desc,
        toolsActive: 12,
        toolsTotal: 12,
        writableCount: 2,
        enabled: true
      });
      renderInstalled();
      renderMarket();
    }

    function jumpToInstalled(id) {
      switchTab('installed');
      state.installedFilter = 'all';
      renderInstalled();
      openDrawer(id);
    }

    function openCustomModal(mode) {
      document.getElementById('add-dropdown').classList.remove('open');
      const titles = {
        json: '粘贴 MCP JSON',
        openapi: '导入 OpenAPI 规范 (HTTP REST)',
        manual: '手动添加自定义服务'
      };
      document.getElementById('modal-title').textContent = titles[mode] || '添加服务';
      if (mode === 'json') {
        document.getElementById('modal-body').innerHTML = `
          <label class="field-label">mcpServers JSON 片段</label>
          <textarea class="textarea-ctrl" rows="6">{\n  "mcpServers": {\n    "my-server": {\n      "command": "npx",\n      "args": ["-y", "@example/mcp-server"]\n    }\n  }\n}</textarea>
        `;
      } else if (mode === 'openapi') {
        document.getElementById('modal-body').innerHTML = `
          <label class="field-label">OpenAPI Spec URL</label>
          <input class="input-ctrl" placeholder="https://api.example.com/openapi.json" />
        `;
      } else {
        document.getElementById('modal-body').innerHTML = `
          <label class="field-label">服务名称</label>
          <input class="input-ctrl" style="margin-bottom:12px;" placeholder="例如 Internal Billing API" />
          <label class="field-label">端点地址或启动命令</label>
          <input class="input-ctrl" placeholder="https://mcp.internal.dev/mcp 或 npx ..." />
        `;
      }
      document.getElementById('modal-foot').innerHTML = `
        <button class="icon-btn" onclick="closeModal()">取消</button>
        <button class="btn-primary" style="border-radius:7px;" onclick="closeModal();showToast('已模拟添加自定义服务')">确认添加</button>
      `;
      document.getElementById('modal-backdrop').classList.add('open');
    }

    function openDrawer(id) {
      const svc = state.services.find(s => s.id === id);
      if (!svc) return;
      state.selectedServiceId = id;
      document.getElementById('drawer-icon').textContent = svc.abbr;
      document.getElementById('drawer-icon').style.color = svc.color;
      document.getElementById('drawer-name').textContent = svc.name;
      document.getElementById('drawer-transport').textContent = svc.transport;

      const statusLabel = !svc.enabled ? '已停用' : svc.status === 'ready' ? '就绪' : svc.status === 'pending' ? '待验证' : '缺少凭据';
      document.getElementById('drawer-body').innerHTML = `
        <p style="margin:0;font-size:13px;line-height:1.55;color:var(--ink-body);">${svc.desc}</p>
        <div class="kv-list">
          <div class="kv-item"><span class="kv-k">当前状态</span><span class="kv-v">${statusLabel}</span></div>
          <div class="kv-item"><span class="kv-k">传输协议</span><span class="kv-v">${svc.transport}</span></div>
          <div class="kv-item"><span class="kv-k">可用工具</span><span class="kv-v">${svc.toolsActive} / ${svc.toolsTotal}</span></div>
          <div class="kv-item"><span class="kv-k">写操作工具</span><span class="kv-v">${svc.writableCount} 个</span></div>
          ${svc.envKey ? `<div class="kv-item"><span class="kv-k">所需凭据</span><span class="kv-v" style="font-family:var(--mono);font-size:11.5px;">${svc.envKey}</span></div>` : ''}
        </div>
        <div style="display:flex;gap:8px;margin-top:16px;">
          ${svc.status === 'needs_action' ? `<button class="btn-primary" style="border-radius:7px;" onclick="closeDrawer();openCredModal('${svc.id}')">填写凭据</button>` : ''}
          ${svc.status === 'pending' ? `<button class="btn-primary" style="border-radius:7px;" onclick="testConnection('${svc.id}');openDrawer('${svc.id}')">测试连接</button>` : ''}
          <button class="icon-btn" onclick="toggleService('${svc.id}');openDrawer('${svc.id}')">${svc.enabled ? '停用服务' : '启用服务'}</button>
        </div>
      `;
      document.getElementById('drawer-backdrop').classList.add('open');
      document.getElementById('inspector-drawer').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('drawer-backdrop').classList.remove('open');
      document.getElementById('inspector-drawer').classList.remove('open');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.remove('open');
    }

    let toastTimer = null;
    function showToast(msg, actionLabel, actionFn) {
      const el = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      const act = document.getElementById('toast-action');
      if (actionLabel && actionFn) {
        act.textContent = actionLabel;
        act.style.display = 'inline';
        act.onclick = () => {
          el.classList.remove('show');
          actionFn();
        };
      } else {
        act.style.display = 'none';
      }
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 3600);
    }

    renderInstalled();
    renderMarket();
  </script>
</body>
</html>
