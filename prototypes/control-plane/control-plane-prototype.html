<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP Gateway Control Plane — Minimalist Polish Prototype</title>
  <style>
    :root {
      --bg-canvas: #ffffff;
      --bg-sidebar: #f7fafc;
      --bg-subtle: #f7fafc;
      --bg-muted: #eef2f6;
      --bg-hover: #f3f6f9;
      --navy-bg: #0a2540;
      --navy-hdr: #0d2e4d;
      --navy-text: #e6edf5;
      --navy-muted: #93a7be;
      --ink-strong: #1a1f36;
      --ink-body: #3c4257;
      --ink-muted: #697386;
      --ink-faint: #8792a2;
      --border: #e3e8ee;
      --border-strong: #cbd5e1;
      --accent: #635bff;
      --accent-soft: #f5f6ff;
      --accent-border: #d5d2ff;
      --success: #0e6245;
      --success-bg: #dcfce7;
      --success-border: #a7f3d0;
      --warning: #92400e;
      --warning-bg: #fef3c7;
      --warning-border: #fde68a;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
      --danger-border: #fecaca;
      --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: var(--sans);
      background: var(--bg-canvas);
      color: var(--ink-body);
      font-size: 13.5px;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 236px;
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 12px 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 4px 8px 14px;
    }
    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      display: grid;
      place-items: center;
      color: var(--accent);
      font-weight: 700;
      font-size: 12px;
    }
    .brand-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink-strong);
      letter-spacing: -0.01em;
    }
    .nav-groups {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding-top: 4px;
    }
    .nav-heading {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-faint);
      padding: 0 10px 4px;
      letter-spacing: 0.02em;
    }
    .nav-item {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 6px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      color: var(--ink-body);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      text-align: left;
    }
    .nav-item:hover { background: var(--bg-muted); }
    .nav-item.active {
      background: var(--bg-canvas);
      border-color: var(--border);
      color: var(--ink-strong);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .nav-item-left { display: flex; align-items: center; gap: 8px; }
    .nav-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--ink-faint);
      opacity: 0.55;
    }
    .nav-item.active .nav-dot { background: var(--accent); opacity: 1; }
    .nav-count {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--ink-faint);
      font-weight: 600;
    }
    .nav-item.active .nav-count { color: var(--accent); }

    .endpoint-box {
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .endpoint-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-strong);
    }
    .endpoint-url {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main Workspace */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-canvas);
    }
    .topbar {
      height: 50px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .bc-muted { color: var(--ink-muted); }
    .bc-sep { color: var(--ink-faint); }
    .bc-active { color: var(--ink-strong); font-weight: 600; }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .viewport {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
    }
    .container {
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Typography & Section Header */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--ink-strong);
      letter-spacing: -0.02em;
      margin: 0;
    }
    .card {
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card-flush {
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .card-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--ink-strong);
      margin: 0;
    }

    /* Hairline Rows (replaces nested cards) */
    .hairline-row {
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .hairline-row:last-child { border-bottom: none; }
    .hairline-row:hover { background: var(--bg-hover); }
    .hairline-row.selected { background: var(--accent-soft); }
    .row-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .row-title-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }
    .row-name {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-strong);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hairline-row.selected .row-name { color: var(--accent); }
    .row-sub {
      font-size: 12px;
      color: var(--ink-faint);
      white-space: nowrap;
    }
    .row-summary {
      font-size: 12.5px;
      color: var(--ink-muted);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .row-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    /* Quiet Meta & De-noised Badges */
    .quiet-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .dot-ok { background: var(--success); }
    .dot-warn { background: #d97706; }
    .dot-err { background: var(--danger); }
    .dot-muted { background: var(--ink-faint); }

    .badge-rw {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: var(--warning-bg);
      color: var(--warning);
      border: 1px solid var(--warning-border);
      letter-spacing: 0.02em;
    }
    .badge-err {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }

    /* Controls */
    .btn {
      border: 1px solid var(--border);
      background: var(--bg-canvas);
      color: var(--ink-body);
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 12.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .btn-primary:hover { background: #5248f5; }
    .btn-pill {
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      background: var(--bg-subtle);
    }
    .btn-toggle-active {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent);
      font-weight: 600;
    }

    .segmented {
      display: inline-flex;
      background: var(--bg-muted);
      padding: 2px;
      border-radius: 6px;
      gap: 2px;
    }
    .seg-btn {
      border: none;
      background: transparent;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--ink-muted);
      border-radius: 5px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
    }
    .seg-btn.active {
      background: var(--bg-canvas);
      color: var(--ink-strong);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }

    .search {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12.5px;
      color: var(--ink-strong);
      background: var(--bg-canvas);
      width: 240px;
      font-family: inherit;
    }
    .search:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

    .switch {
      width: 30px;
      height: 17px;
      border-radius: 999px;
      background: var(--border-strong);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      border: none;
      padding: 0;
    }
    .switch.on { background: var(--accent); }
    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 13px;
      height: 13px;
      border-radius: 999px;
      background: #fff;
      transition: transform 0.14s ease;
    }
    .switch.on::after { transform: translateX(13px); }

    /* Grids & Splits */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }
    .kpi-card {
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .kpi-label { font-size: 12px; font-weight: 600; color: var(--ink-muted); }
    .kpi-val { font-size: 23px; font-weight: 700; color: var(--ink-strong); font-variant-numeric: tabular-nums; }
    .kpi-hint { font-size: 12px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }

    .two-col {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 20px;
      align-items: start;
    }
    .master-detail {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 20px;
      align-items: start;
    }
    .master-detail.logs-layout {
      grid-template-columns: 380px minmax(0, 1fr);
    }
    .master-detail.repos-layout {
      grid-template-columns: 280px minmax(0, 1fr);
    }
    .list-group-hdr {
      padding: 8px 16px 6px;
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-faint);
      background: var(--bg-subtle);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      letter-spacing: 0.02em;
    }
    .select-sm {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      color: var(--ink-strong);
      background: var(--bg-canvas);
      font-family: inherit;
      height: 28px;
    }
    .subset-drawer {
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px 12px 28px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .modal-mask {
      position: fixed;
      inset: 0;
      background: rgba(26, 31, 54, 0.34);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }
    .modal-box {
      width: 100%;
      max-width: 660px;
      max-height: 86vh;
      overflow-y: auto;
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 15px 35px rgba(26, 31, 54, 0.18);
      display: flex;
      flex-direction: column;
    }

    /* Structured Description Block */
    .desc-structured {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .desc-lead {
      font-size: 13px;
      line-height: 1.55;
      color: var(--ink-body);
      margin: 0;
    }
    .desc-bullets {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .desc-bullets li {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--ink-body);
    }
    .desc-bullets li::before {
      content: "•";
      color: var(--ink-faint);
      font-weight: 700;
      flex-shrink: 0;
    }
    .arg-name {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-strong);
      background: var(--bg-muted);
      padding: 1px 5px;
      border-radius: 4px;
      margin-right: 4px;
    }
    .raw-wall {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: var(--mono);
      font-size: 11.5px;
      line-height: 1.5;
      color: var(--ink-muted);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .raw-toggle {
      align-self: flex-start;
      background: none;
      border: none;
      padding: 0;
      color: var(--accent);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .code-navy {
      background: var(--navy-bg);
      color: var(--navy-text);
      border-radius: 7px;
      overflow: hidden;
      font-family: var(--mono);
      font-size: 12px;
    }
    .code-navy-hdr {
      background: var(--navy-hdr);
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--navy-muted);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-between;
    }
    .code-navy pre {
      margin: 0;
      padding: 12px;
      overflow-x: auto;
      line-height: 1.55;
    }

    .kv-row {
      display: flex;
      gap: 12px;
      padding: 5px 0;
      font-size: 12.5px;
    }
    .kv-k { width: 108px; flex-shrink: 0; color: var(--ink-muted); }
    .kv-v { color: var(--ink-strong); min-width: 0; word-break: break-all; }
    .mono { font-family: var(--mono); }

    .before-banner {
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: var(--warning);
      padding: 9px 14px;
      border-radius: 7px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    table.simple {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    table.simple th {
      text-align: left;
      padding: 10px 14px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-muted);
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
    }
    table.simple td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--ink-body);
      font-variant-numeric: tabular-nums;
    }
    table.simple tr:last-child td { border-bottom: none; }
    textarea.input-area, input.input-line {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 13px;
      color: var(--ink-strong);
      background: var(--bg-canvas);
      transition: border-color 0.15s ease;
    }
    textarea.input-area:focus, input.input-line:focus {
      outline: none;
      border-color: var(--accent);
    }
    .field-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      gap: 8px;
    }
    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-strong);
    }
    .btn-link {
      border: none;
      background: transparent;
      color: var(--ink-muted);
      font-size: 12px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-link:hover {
      color: var(--danger);
      background: var(--danger-bg);
    }
    .stepper {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stepper .input-line {
      width: 84px;
      text-align: center;
    }
    .result-box {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      background: var(--bg-subtle);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .result-box.ok {
      border-color: var(--success-border);
      background: #f6fef9;
    }
    .result-box.err {
      border-color: var(--danger-border);
      background: #fef6f6;
    }
    .market-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    @media (max-width: 1120px) {
      .market-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .market-card {
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .market-card:hover {
      border-color: var(--border-strong);
      box-shadow: 0 2px 6px rgba(10, 37, 64, 0.04);
    }
    .market-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-strong);
    }
    .market-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .tag-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      background: var(--bg-muted);
      color: var(--ink-muted);
    }
    .market-desc {
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--ink-body);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 38px;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 37, 64, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }
    .modal-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-canvas);
      border: 1px solid var(--border);

    function stripMd(s) {

    function parseRichDescription(raw) {
      const text = (raw || "").replace(/\r\n/g, "\n").trim();
      if (!text) return { summary: "", lead: "", bullets: [], raw: "", hasMore: false };
      const lines = text.split("\n");
      let leadParts = [];
      let bullets = [];
      let inArgs = false;
      let inExtra = false;
      let sawLeadBlank = false;
      let hasMore = false;

      for (const rawLine of lines) {
        const trimmed = rawLine.trim();
        if (!trimmed) {
          if (leadParts.length > 0 && !inArgs) sawLeadBlank = true;
          continue;
        }
        const lower = trimmed.toLowerCase();
        if (/^(args|arguments|parameters|params|inputs|参数|参数说明)\s*[:：]?$/.test(lower)) {
          inArgs = true;
          inExtra = false;
          continue;
        }
        if (/^(returns|return|outputs?|examples?|notes?|返回值|示例|注意)\s*[:：]?$/.test(lower)) {
          inExtra = true;
          inArgs = false;
          hasMore = true;
          continue;
        }
        if (inExtra) {
          hasMore = true;
          continue;
        }
        const bulletMatch = trimmed.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/);
        if (bulletMatch) {
          bullets.push(stripMd(bulletMatch[1]));
          continue;
        }
        if (inArgs) {
          bullets.push(stripMd(trimmed));
          continue;
        }
        if (sawLeadBlank && leadParts.length > 0) {
          hasMore = true;
          continue;
        }
        leadParts.push(stripMd(trimmed));
      }

      const lead = leadParts.join(" ").replace(/\s+/g, " ").trim();
      let summary = lead || (bullets[0] || "");
      const m = summary.match(/^(.+?[。！？!?]|.+?\.\s)/);
      if (m) summary = m[1].trim();
      if (summary.length > 100) summary = summary.slice(0, 99) + "…";
      if (bullets.length > 6) hasMore = true;
      return { summary, lead, bullets, raw: text, hasMore };
    }

    function findScopeRule(repoKey, agentKey) {
      return SCOPE_RULES.find(r => r.repo_key === repoKey && r.agent_key === agentKey) || null;
    }

    function ensureScopeRule(repoKey, agentKey, seedGrants) {
      let r = findScopeRule(repoKey, agentKey);
      if (!r) {
        r = { repo_key: repoKey, agent_key: agentKey, grants: JSON.parse(JSON.stringify(seedGrants || [])) };
        SCOPE_RULES.push(r);
      }
      return r;
    }

    function evaluateEffectiveScope(repoKey, agentId) {
      const candidates = repoKey === "*"
        ? [
            { rk: "*", ak: agentId, label: "全局客户端例外" },
            { rk: "*", ak: "*", label: "全局默认" }
          ]
        : [
            { rk: repoKey, ak: agentId, label: "客户端例外" },
            { rk: repoKey, ak: "*", label: "仓库默认" },
            { rk: "*", ak: agentId, label: "全局客户端默认" },
            { rk: "*", ak: "*", label: "全局默认" }
          ];
      let matched = { rk: "*", ak: "*", label: "全局默认", grants: [] };
      for (const c of candidates) {
        const rule = findScopeRule(c.rk, c.ak);
        if (rule) {
          matched = { ...c, grants: rule.grants };
          break;
        }
      }
      let toolCount = 0;
      let hasWrite = false;
      for (const g of matched.grants) {
        const all = SERVICE_TOOLS[g.server_id] || [];
        const subset = (g.tool_ids && g.tool_ids.length) ? all.filter(t => g.tool_ids.includes(t.id)) : all;
        const allowed = subset.filter(t => g.access === "rw" || !t.rw);
        toolCount += allowed.length;
        if (g.access === "rw" && allowed.some(t => t.rw)) hasWrite = true;
      }
      return {
        matched_repo_key: matched.rk,
        matched_agent_key: matched.ak,
        source_label: matched.grants.length === 0 ? `${matched.label} · 无权限` : matched.label,
        server_count: matched.grants.length,
        tool_count: toolCount,
        has_write: hasWrite
      };
    }

    function loadInstalledMarketIds() {
      try {
        const raw = localStorage.getItem(MARKET_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return new Set(parsed);
        }
      } catch {}
      return new Set(["github"]);
    }

    let marketQuery = "";
    let marketFilter = "all"; // all | featured | http | stdio | installed
    let installedMarketIds = loadInstalledMarketIds();
    let marketModalItem = null;
    let marketModalValues = {};
    let marketToast = "";

    function saveInstalledMarketIds() {
      try {
        localStorage.setItem(MARKET_STORAGE_KEY, JSON.stringify([...installedMarketIds]));
      } catch {}
    }

    function setMarketFilter(next) {
      marketFilter = next;
      render();
    }

    function updateMarketQuery(val) {
      marketQuery = val;
      render();
      const el = document.getElementById("market-search-input");
      if (el) {
        el.focus();
        el.setSelectionRange(val.length, val.length);
      }
    }

    function findMarketItem(id) {
      return MARKET_SERVERS.find(x => x.id === id) || REGISTRY_RESULTS.find(x => x.id === id);
    }

    function handleMarketAddClick(id) {
      const item = findMarketItem(id);
      if (!item) return;
      if (!item.inputs || item.inputs.length === 0) {
        installMarketServer(item, {});
        return;
      }
      marketModalItem = item;
      marketModalValues = {};
      render();
    }

    function closeMarketModal() {
      marketModalItem = null;
      marketModalValues = {};
      render();
    }

    function updateMarketModalInput(key, val) {
      marketModalValues[key] = val;
    }

    function confirmMarketModalInstall() {
      if (!marketModalItem) return;
      for (const inp of marketModalItem.inputs || []) {
        if (inp.required && !(marketModalValues[inp.key] || "").trim()) {
          alert(`请填写必填项：${inp.label}`);
          return;
        }
      }
      const item = marketModalItem;
      const vals = { ...marketModalValues };
      marketModalItem = null;
      marketModalValues = {};
      installMarketServer(item, vals);
    }

    function installMarketServer(item, values) {
      installedMarketIds.add(item.id);
      saveInstalledMarketIds();
      if (!SERVICES.some(s => s.id === item.id)) {
        SERVICES.unshift({
          id: item.id,
          name: item.title,
          kind: item.transport === "http" ? "HTTP MCP" : "Stdio MCP",
          endpoint: item.endpoint || item.command,
          enabled: true,
          status: "connected",
          toolCount: 6,
          enabledCount: 4,
          tools: []
        });
      }
      marketToast = `已添加 ${item.title} 并同步至上游服务`;
      render();
      setTimeout(() => {
        marketToast = "";
        const toastEl = document.getElementById("market-toast");
        if (toastEl) toastEl.remove();
      }, 2800);
    }

    function renderMarket() {
      const q = marketQuery.trim().toLowerCase();
      const matchesQuery = (m) => !q || (m.title + " " + m.id + " " + m.publisher + " " + m.description + " " + (m.endpoint || m.command || "")).toLowerCase().includes(q);
      const matchesFilter = (m) => {
        if (marketFilter === "featured") return m.featured;
        if (marketFilter === "http") return m.transport === "http";
        if (marketFilter === "stdio") return m.transport === "stdio";
        if (marketFilter === "installed") return installedMarketIds.has(m.id);
        return true;
      };

      const featuredMatches = MARKET_SERVERS.filter(m => matchesQuery(m) && matchesFilter(m));
      const registryMatches = q ? REGISTRY_RESULTS.filter(m => matchesQuery(m) && matchesFilter(m)) : [];

      const pill = (id, label) => `<button class="btn ${marketFilter === id ? "btn-toggle-active" : ""}" type="button" onclick="setMarketFilter('${id}')">${label}</button>`;

      return `
        <div class="section-header">
          <h1 class="section-title">MCP 市场</h1>
          <div style="display:flex;align-items:center;gap:10px;">
            ${marketToast ? `<span id="market-toast" class="quiet-meta" style="color:var(--success);font-weight:500;"><span class="dot dot-ok"></span>${escapeHtml(marketToast)}</span>` : ""}

        ${featuredMatches.length > 0 ? `
          <div class="market-grid">
            ${featuredMatches.map(renderMarketCard).join("")}

          <div class="card" style="align-items:center;text-align:center;padding:36px 20px;">
            <div style="font-size:14px;font-weight:600;color:var(--ink-strong);">未找到匹配的 MCP 服务</div>

        ` : "")}

        ${registryMatches.length > 0 ? `
          <div style="display:flex;flex-direction:column;gap:10px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <span style="font-size:12.5px;font-weight:600;color:var(--ink-body);">官方 MCP Registry 搜索结果</span>

            <div class="market-grid">
              ${registryMatches.map(renderMarketCard).join("")}

          </div>

        ${renderMarketModal()}

              <div style="border-top:1px solid var(--border);padding-top:12px;">
                <div style="font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:8px;">命中工具</div>
                ${ev.tools.map(t => `<div class="hairline-row" style="padding:10px 0;"><div class="row-main"><div class="row-name">${esc(t.id)}</div><div class="row-summary">${esc(t.reason)}</div></div></div>`).join("")}

            ` : ""}
            <div class="code-navy">

          </div>

    }

    function renderPlayground() {
      const sample = TOOLS[1];
      const parsed = parseRichDescription(sample.rawDescription);
      const eff = playgroundSimRepo
        ? evaluateEffectiveScope(playgroundSimRepo, playgroundSimAgent === "*" ? "codex" : playgroundSimAgent)
        : { tool_count: 18, source_label: "管理员全量" };
      return `
        <div class="section-header">
          <h1 class="section-title">路由沙盒</h1>
          <span class="quiet-meta"><span class="dot dot-ok"></span>gpt-6-luna · ${eff.tool_count} 候选工具</span>
        </div>
        <div class="two-col">
          <div style="display:flex;flex-direction:column;gap:18px;">
            <div class="card">
              <div class="card-header"><h2 class="card-title">任务意图</h2><span class="quiet-meta">⌘+Enter</span></div>
              <textarea class="input-area" rows="3" oninput="playgroundIntent=this.value">${esc(playgroundIntent)}</textarea>
              <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                  <span class="quiet-meta">身份：developer</span>
                  <select class="select-sm" onchange="playgroundSimRepo=this.value;render();">
                    <option value="" ${playgroundSimRepo === "" ? "selected" : ""}>仓库：管理员全量</option>
                    <option value="*" ${playgroundSimRepo === "*" ? "selected" : ""}>仓库：未绑定新仓库 (*)</option>
                    ${REPOS.map(r => `<option value="${r.id}" ${playgroundSimRepo === r.id ? "selected" : ""}>仓库：${esc(r.name)}</option>`).join("")}
                  </select>
                  <select class="select-sm" onchange="playgroundSimAgent=this.value;if(!playgroundSimRepo&&this.value!=='*')playgroundSimRepo='*';render();">
                    <option value="*" ${playgroundSimAgent === "*" ? "selected" : ""}>客户端：默认 (*)</option>
                    ${AGENTS.map(a => `<option value="${a.id}" ${playgroundSimAgent === a.id ? "selected" : ""}>客户端：${esc(a.label)}</option>`).join("")}
                  </select>
                </div>
                <button class="btn btn-primary" onclick="render()">发起路由发现</button>
              </div>
            </div>
            <div class="card-flush">
              <div class="card-header" style="padding:14px 18px;border-bottom:1px solid var(--border);">
                <h2 class="card-title">命中工具</h2>
                <span class="quiet-meta">${eff.tool_count > 0 ? "1 命中 · 42 ms" : "0 命中（作用域已拦截）"}</span>
              </div>
              ${eff.tool_count > 0 ? `
                <div class="hairline-row selected">
                  <div class="row-main">
                    <div class="row-title-line"><span class="row-name">k8s.describe_pod_events</span><span class="row-sub">K8s Diagnostics</span></div>
                    <div class="row-summary">${esc(parsed.summary)}</div>
                  </div>
                  <div class="row-right"><span class="quiet-meta">RO</span></div>
                </div>
              ` : `
                <div style="padding:18px;font-size:12.5px;color:var(--ink-muted);">当前模拟作用域（sim_scope）开放 0 个候选工具，路由直接跳过模型调用。</div>
              `}
            </div>
          </div>

          <div class="card">
            <div class="card-header"><h2 class="card-title mono">describe_pod_events</h2><span class="quiet-meta">RO</span></div>
            <div class="desc-structured">
              <p class="desc-lead">${esc(parsed.lead)}</p>
              <ul class="desc-bullets">${parsed.bullets.map(renderBulletHTML).join("")}</ul>
            </div>
            <div class="code-navy">
              <div class="code-navy-hdr"><span>INPUT SCHEMA</span><span>复制</span></div>
              <pre>{\n  "type": "object",\n  "properties": {\n    "namespace": { "type": "string" },\n    "pod_name": { "type": "string" }\n  },\n  "required": ["namespace"]\n}</pre>
            </div>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    const SETTINGS_STORAGE_KEY = "mcp_gateway_proto_profiles_v1";
    const DEFAULT_MODELS = [
      {
        id: "m-gemini",
        baseUrl: "https://generativelanguage.googleapis.com/v1beta",
        modelId: "gemini-decision-1",
        hasKey: true,
        maxResults: 4,
        timeoutSec: 45,
        verifyIntent: "",
        active: true,
        savedAt: "22:54:48"
      },
      {
        id: "m-openai",
        baseUrl: "https://api.openai.com/v1",
        modelId: "gpt-5-mini",
        hasKey: true,
        maxResults: 4,
        timeoutSec: 30,
        verifyIntent: "",
        active: false,
        savedAt: "21:18:10"
      }
    ];

    function loadSavedModels() {
      try {
        const raw = localStorage.getItem(SETTINGS_STORAGE_KEY);
        if (!raw) return DEFAULT_MODELS.map(m => ({ ...m }));
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) && parsed.length ? parsed : DEFAULT_MODELS.map(m => ({ ...m }));
      } catch {
        return DEFAULT_MODELS.map(m => ({ ...m }));
      }
    }

    function persistModelsList() {
      try {
        localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(savedModels));
      } catch {}
    }

    let savedModels = loadSavedModels();
    const initialActive = savedModels.find(m => m.active) || savedModels[0];
    let editingModelId = initialActive ? initialActive.id : null;
    let settingsDraft = {
      baseUrl: initialActive?.baseUrl || "",
      modelId: initialActive?.modelId || "",
      hasKey: Boolean(initialActive?.hasKey),
      apiKeyInput: "",
      maxResults: initialActive?.maxResults || 4,
      timeoutSec: initialActive?.timeoutSec || 45,
      verifyIntent: initialActive?.verifyIntent || ""
    };
    let settingsDirty = false;
    let advancedExpanded = false;
    let modelTestState = {
      status: "passed", // idle | testing | passed | error
      message: `${settingsDraft.modelId} 已响应`,
      latencyMs: 342
    };
    let routeVerifyState = {
      status: "idle", // idle | running | passed | error
      timestamp: initialActive?.savedAt || "22:54:48",
      latencyMs: 2112,
      tool: "github.add_comment_to_pending_review",
      detail: "Decisions 相关性概率 95.5%，精选占比 99.8%"
    };

    function nowTimeStr() {
      const d = new Date();
      return d.toTimeString().slice(0, 8);
    }

    function applyPreset(kind) {
      editingModelId = null;
      if (kind === "openai") {
        settingsDraft.baseUrl = "https://api.openai.com/v1";
        settingsDraft.modelId = "gpt-5-mini";
      } else {
        settingsDraft.baseUrl = "https://generativelanguage.googleapis.com/v1beta";
        settingsDraft.modelId = "gemini-decision-1";
      }
      settingsDirty = true;
      modelTestState = { status: "idle", message: "模型配置已变更，点击「测试连接」验证可用性", latencyMs: null };
      render();
    }

    function updateSettingField(field, value) {
      settingsDraft[field] = value;
      settingsDirty = true;
      if (field === "baseUrl" || field === "modelId" || field === "apiKeyInput") {
        modelTestState = { status: "idle", message: "模型配置已变更，点击「测试连接」验证可用性", latencyMs: null };
      }
      renderDirtyBadgesOnly();
    }

    function clearStoredApiKey() {
      settingsDraft.hasKey = false;
      settingsDraft.apiKeyInput = "";
      settingsDirty = true;
      modelTestState = { status: "idle", message: "API Key 已清除，请重新输入后测试连接", latencyMs: null };
      render();
    }

    function toggleAdvancedSettings() {
      advancedExpanded = !advancedExpanded;
      render();
    }

    function stepSetting(field, delta, min, max) {
      const next = Math.min(max, Math.max(min, Number(settingsDraft[field] || min) + delta));
      settingsDraft[field] = next;
      settingsDirty = true;
      render();
    }

    function renderDirtyBadgesOnly() {
      const saveBtn = document.getElementById("btn-save-settings");
      if (saveBtn) {
        saveBtn.className = settingsDirty ? "btn btn-primary" : "btn";
        saveBtn.textContent = settingsDirty ? "保存配置" : "保存配置";
      }
    }

    function runModelTest() {
      const hasUrl = settingsDraft.baseUrl.trim().length > 0;
      const hasModel = settingsDraft.modelId.trim().length > 0;
      const hasAnyKey = settingsDraft.hasKey || settingsDraft.apiKeyInput.trim().length > 0;

      if (!hasUrl || !hasModel || !hasAnyKey) {
        modelTestState = {
          status: "error",
          message: !hasAnyKey ? "连接失败：请先输入 API Key" : "连接失败：请填写 Base URL 与 Model ID",
          latencyMs: null
        };
        render();
        return;
      }

      modelTestState = { status: "testing", message: "正在测试模型连接...", latencyMs: null };
      render();

      setTimeout(() => {
        const keyVal = settingsDraft.apiKeyInput.trim().toLowerCase();
        if (keyVal === "invalid" || settingsDraft.baseUrl.includes("invalid")) {
          modelTestState = {
            status: "error",
            message: "连接失败：401 Unauthorized（API Key 无效或无权访问该模型）",
            latencyMs: 218
          };
        } else {
          const latency = 240 + Math.floor(Math.random() * 220);
          modelTestState = {
            status: "passed",
            message: `${escapeHtml(settingsDraft.modelId.trim())} 已响应`,
            latencyMs: latency
          };
        }
        render();
      }, 420);
    }

    function persistAllSettings() {
      const nextHasKey = settingsDraft.apiKeyInput.trim().length > 0 ? true : settingsDraft.hasKey;
      const baseUrl = settingsDraft.baseUrl.trim();
      const modelId = settingsDraft.modelId.trim();
      if (!baseUrl || !modelId) return null;

      const now = nowTimeStr();
      const existing = editingModelId
        ? savedModels.find(m => m.id === editingModelId)
        : savedModels.find(m => m.modelId === modelId && m.baseUrl === baseUrl);

      let targetId;
      if (existing) {
        existing.baseUrl = baseUrl;
        existing.modelId = modelId;
        existing.hasKey = nextHasKey;
        existing.maxResults = Math.min(12, Math.max(1, Number(settingsDraft.maxResults) || 4));
        existing.timeoutSec = Math.min(180, Math.max(5, Number(settingsDraft.timeoutSec) || 45));
        existing.verifyIntent = settingsDraft.verifyIntent.trim();
        existing.savedAt = now;
        targetId = existing.id;
      } else {
        targetId = "m-" + Date.now();
        savedModels.unshift({
          id: targetId,
          baseUrl,
          modelId,
          hasKey: nextHasKey,
          maxResults: Math.min(12, Math.max(1, Number(settingsDraft.maxResults) || 4)),
          timeoutSec: Math.min(180, Math.max(5, Number(settingsDraft.timeoutSec) || 45)),
          verifyIntent: settingsDraft.verifyIntent.trim(),
          active: true,
          savedAt: now
        });
      }

      savedModels.forEach(m => { m.active = (m.id === targetId); });
      editingModelId = targetId;
      settingsDraft.baseUrl = baseUrl;
      settingsDraft.modelId = modelId;
      settingsDraft.hasKey = nextHasKey;
      settingsDraft.apiKeyInput = "";
      settingsDirty = false;
      persistModelsList();
      return savedModels.find(m => m.id === targetId);
    }

    function saveAllSettings() {
      const saved = persistAllSettings();
      if (!saved) {
        modelTestState = { status: "error", message: "请填写 Base URL 与 Model ID 后再保存", latencyMs: null };
      }
      render();
    }

    function activateSavedModel(id) {
      const target = savedModels.find(m => m.id === id);
      if (!target) return;
      savedModels.forEach(m => { m.active = (m.id === id); });
      persistModelsList();
      editSavedModel(id);
    }

    function editSavedModel(id) {
      const target = savedModels.find(m => m.id === id);
      if (!target) return;
      editingModelId = target.id;
      settingsDraft = {
        baseUrl: target.baseUrl,
        modelId: target.modelId,
        hasKey: Boolean(target.hasKey),
        apiKeyInput: "",
        maxResults: target.maxResults,
        timeoutSec: target.timeoutSec,
        verifyIntent: target.verifyIntent || ""
      };
      settingsDirty = false;
      modelTestState = { status: "idle", message: `已载入 ${escapeHtml(target.modelId)}，可点击测试连接`, latencyMs: null };
      render();
    }

    function deleteSavedModel(id) {
      if (savedModels.length <= 1) return;
      const idx = savedModels.findIndex(m => m.id === id);
      if (idx === -1) return;
      const wasActive = savedModels[idx].active;
      savedModels.splice(idx, 1);
      if (wasActive && savedModels.length) {
        savedModels[0].active = true;
      }
      if (editingModelId === id && savedModels.length) {
        editSavedModel(savedModels[0].id);
        return;
      }
      persistModelsList();
      render();
    }

    function saveAndRunRouteVerify() {
      const saved = persistAllSettings();
      if (!saved || !saved.hasKey) {
        routeVerifyState = {
          status: "error",
          timestamp: nowTimeStr(),
          latencyMs: null,
          tool: "",
          detail: "模型配置不完整（缺少 Base URL、Model ID 或 API Key），无法运行路由校验。"
        };
        render();
        return;
      }

      routeVerifyState = { status: "running", timestamp: nowTimeStr(), latencyMs: null, tool: "", detail: "" };
      render();

      setTimeout(() => {
        const latency = 1280 + Math.floor(Math.random() * 950);
        const intent = saved.verifyIntent || "默认语义路由探针";
        modelTestState = {
          status: "passed",
          message: `${escapeHtml(saved.modelId)} 已响应`,
          latencyMs: 310
        };
        routeVerifyState = {
          status: "passed",
          timestamp: nowTimeStr(),
          latencyMs: latency,
          tool: "github.add_comment_to_pending_review",
          detail: `意图「${escapeHtml(intent)}」匹配成功 · 相关性概率 95.5%，精选占比 99.8%`
        };
        render();
      }, 650);
    }

    function renderModelTestStatus() {
      if (modelTestState.status === "testing") {
        return `<span class="quiet-meta"><span class="dot dot-warn"></span>正在测试模型连接...</span>`;
      }
      if (modelTestState.status === "passed") {
        return `<span class="quiet-meta" style="color:var(--success);font-weight:500;"><span class="dot dot-ok"></span>模型测试通过 · ${modelTestState.message} · ${modelTestState.latencyMs} ms</span>`;
      }
      if (modelTestState.status === "error") {
        return `<span class="quiet-meta" style="color:var(--danger);font-weight:500;"><span class="dot dot-err"></span>${modelTestState.message}</span>`;
      }
      return `<span class="quiet-meta"><span class="dot dot-muted"></span>${modelTestState.message}</span>`;
    }

    function renderSettings() {
      const hasConfiguredKey = settingsDraft.hasKey;
      const keyStatusHtml = hasConfiguredKey
        ? `<div style="display:flex;align-items:center;gap:6px;">
             <span class="quiet-meta"><span class="dot dot-ok"></span>已配置</span>
             <button class="btn-link" type="button" onclick="clearStoredApiKey()">清除</button>
           </div>`
        : `<span class="quiet-meta"><span class="dot dot-muted"></span>未配置</span>`;

      let verifyBoxHtml = "";
      if (routeVerifyState.status === "running") {
        verifyBoxHtml = `
          <div class="result-box">
            <span class="quiet-meta"><span class="dot dot-warn"></span>正在运行路由校验...</span>
          </div>`;
      } else if (routeVerifyState.status === "passed") {
        verifyBoxHtml = `
          <div class="result-box ok">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
              <span class="quiet-meta" style="color:var(--success);font-weight:600;"><span class="dot dot-ok"></span>路由校验通过 · selected · ${routeVerifyState.timestamp}</span>
              <span class="quiet-meta mono">${routeVerifyState.latencyMs} ms</span>
            </div>
            <div style="font-size:12.5px;color:var(--ink-body);">
              <span class="mono" style="font-weight:600;color:var(--ink-strong);">${routeVerifyState.tool}</span>
              — ${routeVerifyState.detail}
            </div>
          </div>`;
      } else if (routeVerifyState.status === "error") {
        verifyBoxHtml = `
          <div class="result-box err">
            <span class="quiet-meta" style="color:var(--danger);font-weight:600;"><span class="dot dot-err"></span>路由校验失败 · ${routeVerifyState.timestamp}</span>
            <div style="font-size:12.5px;color:var(--danger);">${routeVerifyState.detail}</div>
          </div>`;
      }

      const savedModelsRowsHtml = savedModels.map(m => {
        const isEditing = m.id === editingModelId;
        return `
          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border-bottom:1px solid var(--border);${isEditing ? 'background:var(--bg-subtle);' : ''}">
            <div style="min-width:0;flex:1;display:flex;flex-direction:column;gap:3px;">
              <div style="display:flex;align-items:center;gap:8px;">
                <span class="mono" style="font-size:13px;font-weight:600;color:var(--ink-strong);">${escapeHtml(m.modelId)}</span>
                ${m.active
                  ? `<span class="quiet-meta" style="color:var(--success);font-weight:500;"><span class="dot dot-ok"></span>使用中</span>`
                  : `<span class="quiet-meta"><span class="dot dot-muted"></span>备用</span>`}
              </div>
              <div class="mono" style="font-size:12px;color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(m.baseUrl)}</div>
            </div>

            <div class="quiet-meta mono" style="flex-shrink:0;">
              ${m.hasKey ? 'Key 已配置' : '未配置 Key'} · 上限 ${m.maxResults} · ${m.timeoutSec}s
            </div>

            <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
              ${!m.active ? `<button class="btn" type="button" onclick="activateSavedModel('${m.id}')">设为当前</button>` : ''}
              <button class="btn" type="button" onclick="editSavedModel('${m.id}')">${isEditing ? '编辑中' : '编辑'}</button>
              ${savedModels.length > 1 ? `<button class="btn-link" type="button" onclick="deleteSavedModel('${m.id}')">删除</button>` : ''}
            </div>
          </div>
        `;
      }).join("");

      return `
        <div class="section-header">
          <h1 class="section-title">访问与路由</h1>
          <span class="badge-rw">已开放 2 个 RW 写工具</span>
        </div>

        <div class="card-flush">
          <div class="card-header" style="padding:16px 20px;border-bottom:1px solid var(--border);">
            <h2 class="card-title">调用身份护栏矩阵</h2>
            <button class="btn">审查写工具 (2)</button>
          </div>
          <table class="simple">
            <thead>
              <tr><th>Actor</th><th>可达服务</th><th>开放工具</th><th>只读</th><th>写操作 RW</th></tr>
            </thead>
            <tbody>
              <tr><td class="mono" style="font-weight:600;color:var(--ink-strong);">developer</td><td>3</td><td>18</td><td>16</td><td style="color:var(--warning);font-weight:600;">2</td></tr>
              <tr><td class="mono" style="font-weight:600;color:var(--ink-strong);">observer</td><td>3</td><td>16</td><td>16</td><td style="color:var(--ink-muted);">0</td></tr>
            </tbody>
          </table>
        </div>

        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Decisions 语义路由模型</h2>
            <div style="display:flex;gap:8px;">
              <button class="btn" type="button" onclick="applyPreset('openai')">OpenAI 预设</button>
              <button class="btn" type="button" onclick="applyPreset('gemini')">Gemini 预设</button>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
            <div>
              <div class="field-label-row"><span class="field-label">Base URL</span></div>
              <input class="input-line mono" value="${escapeHtml(settingsDraft.baseUrl)}" oninput="updateSettingField('baseUrl', this.value)" placeholder="https://api.openai.com/v1" />
            </div>
            <div>
              <div class="field-label-row"><span class="field-label">Model ID</span></div>
              <input class="input-line mono" value="${escapeHtml(settingsDraft.modelId)}" oninput="updateSettingField('modelId', this.value)" placeholder="gpt-5-mini" />
            </div>
          </div>

          <div>
            <div class="field-label-row">
              <span class="field-label">API Key</span>
              ${keyStatusHtml}
            </div>
            <input class="input-line mono" type="password" value="${escapeHtml(settingsDraft.apiKeyInput)}" oninput="updateSettingField('apiKeyInput', this.value)" placeholder="${hasConfiguredKey ? '留空保持当前 Key' : '输入 API Key（输入 invalid 可模拟失败）'}" />
          </div>

          <div style="display:flex;flex-direction:column;gap:10px;padding-top:2px;">
            <button type="button" onclick="toggleAdvancedSettings()" style="display:flex;align-items:center;justify-content:space-between;width:100%;background:transparent;border:none;padding:2px 0;cursor:pointer;text-align:left;">
              <span style="font-size:12.5px;font-weight:600;color:var(--ink-body);display:flex;align-items:center;gap:6px;">
                <span style="display:inline-block;width:12px;color:var(--ink-muted);">${advancedExpanded ? '▾' : '▸'}</span>
                高级设置 · 路由策略与校验
              </span>
              <span class="quiet-meta mono">上限 ${settingsDraft.maxResults} · 超时 ${settingsDraft.timeoutSec}s</span>
            </button>

            ${advancedExpanded ? `
              <div style="display:flex;flex-direction:column;gap:14px;padding:12px 14px;background:var(--bg-subtle);border:1px solid var(--border);border-radius:8px;">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
                  <div>
                    <div class="field-label-row"><span class="field-label">单次返回上限 (1–12)</span></div>
                    <div class="stepper">
                      <input class="input-line mono" value="${settingsDraft.maxResults}" oninput="updateSettingField('maxResults', this.value)" />
                      <button class="btn" type="button" onclick="stepSetting('maxResults', -1, 1, 12)">−</button>
                      <button class="btn" type="button" onclick="stepSetting('maxResults', 1, 1, 12)">+</button>
                    </div>
                  </div>
                  <div>
                    <div class="field-label-row"><span class="field-label">请求超时 (5–180 秒)</span></div>
                    <div class="stepper">
                      <input class="input-line mono" value="${settingsDraft.timeoutSec}" oninput="updateSettingField('timeoutSec', this.value)" />
                      <button class="btn" type="button" onclick="stepSetting('timeoutSec', -5, 5, 180)">−</button>
                      <button class="btn" type="button" onclick="stepSetting('timeoutSec', 5, 5, 180)">+</button>
                    </div>
                  </div>
                </div>

                <div>
                  <div class="field-label-row"><span class="field-label">校验意图（可选）</span></div>
                  <input class="input-line" value="${escapeHtml(settingsDraft.verifyIntent)}" oninput="updateSettingField('verifyIntent', this.value)" placeholder="留空自动生成" />
                </div>

                ${verifyBoxHtml}

                <div style="display:flex;justify-content:flex-end;">
                  <button class="btn" type="button" onclick="saveAndRunRouteVerify()">运行路由校验</button>
                </div>
              </div>
            ` : ''}
          </div>

          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px;">
            ${renderModelTestStatus()}
            <div style="display:flex;gap:8px;flex-shrink:0;">
              <button class="btn" type="button" onclick="runModelTest()" ${modelTestState.status === 'testing' ? 'disabled' : ''}>
                ${modelTestState.status === 'testing' ? '测试中...' : '测试连接'}
              </button>
              <button id="btn-save-settings" class="${settingsDirty ? 'btn btn-primary' : 'btn'}" type="button" onclick="saveAllSettings()">
                保存配置
              </button>
            </div>
          </div>
        </div>

        <div class="card-flush">
          <div class="card-header" style="padding:16px 20px;border-bottom:1px solid var(--border);">
            <h2 class="card-title">已保存的模型</h2>
            <span class="quiet-meta">${savedModels.length} 个配置</span>
          </div>
          <div>
            ${savedModelsRowsHtml}
          </div>
        </div>
      `;
    }

    function addGrant(repoKey, agentKey, serverId) {
      const rule = ensureScopeRule(repoKey, agentKey, []);
      if (!rule.grants.some(g => g.server_id === serverId)) {
        rule.grants.push({ server_id: serverId, access: "ro", tool_ids: [] });
      }
      render();
    }

    function removeGrant(repoKey, agentKey, serverId) {
      const rule = ensureScopeRule(repoKey, agentKey, []);
      rule.grants = rule.grants.filter(g => g.server_id !== serverId);
      render();
    }

    function setGrantAccess(repoKey, agentKey, serverId, access) {
      const rule = ensureScopeRule(repoKey, agentKey, []);
      const g = rule.grants.find(x => x.server_id === serverId);
      if (g) g.access = access;
      render();
    }

    function toggleGrantTool(repoKey, agentKey, serverId, toolId) {
      const rule = ensureScopeRule(repoKey, agentKey, []);
      const g = rule.grants.find(x => x.server_id === serverId);
      if (!g) return;
      const allIds = (SERVICE_TOOLS[serverId] || []).map(t => t.id);
      let current = (g.tool_ids && g.tool_ids.length) ? [...g.tool_ids] : [...allIds];
      if (current.includes(toolId)) current = current.filter(x => x !== toolId);
      else current.push(toolId);
      g.tool_ids = current.length === allIds.length ? [] : current;
      render();
    }

    function resetGrantTools(repoKey, agentKey, serverId) {
      const rule = findScopeRule(repoKey, agentKey);
      const g = rule && rule.grants.find(x => x.server_id === serverId);
      if (g) g.tool_ids = [];
      render();
    }

    function addAgentOverride(repoKey, agentId) {
      const base = findScopeRule(repoKey, "*");
      ensureScopeRule(repoKey, agentId, base ? base.grants : []);
      render();
    }

    function removeAgentOverride(repoKey, agentId) {
      SCOPE_RULES = SCOPE_RULES.filter(r => !(r.repo_key === repoKey && r.agent_key === agentId));
      render();
    }

    function bindObservedRepo(fp) {
      const obs = OBSERVED_REPOS.find(o => o.fingerprint === fp);
      if (!obs) return;
      const newId = "repo-" + obs.name.toLowerCase().replace(/[^a-z0-9]+/g, "-");
      REPOS.push({
        id: newId,
        name: obs.name,
        git_common_dirs: obs.git_common_dir ? [obs.git_common_dir] : [],
        root_paths: obs.git_common_dir ? [] : [obs.root],
        remote_hint: obs.remote_hint || ""
      });
      ensureScopeRule(newId, "*", []);
      OBSERVED_REPOS = OBSERVED_REPOS.filter(o => o.fingerprint !== fp);
      selectedScopeRepoKey = newId;
      render();
    }

    function bindFromLog(rootPath) {
      const name = rootPath.split("/").filter(Boolean).pop() || "bound-repo";
      const obs = OBSERVED_REPOS.find(o => o.root === rootPath);
      if (obs) {
        bindObservedRepo(obs.fingerprint);
        switchPage("repos");
        return;
      }
      const newId = "repo-" + name.toLowerCase();
      REPOS.push({ id: newId, name, git_common_dirs: [rootPath + "/.git"], root_paths: [], remote_hint: "" });
      ensureScopeRule(newId, "*", []);
      selectedScopeRepoKey = newId;
      switchPage("repos");
    }

    function deleteBoundRepo(id) {
      const idx = REPOS.findIndex(r => r.id === id);
      if (idx >= 0) REPOS.splice(idx, 1);
      SCOPE_RULES = SCOPE_RULES.filter(r => r.repo_key !== id);
      selectedScopeRepoKey = REPOS[0] ? REPOS[0].id : "*";
      render();
    }

    function jumpToPlaygroundWithScope(repoKey, agentId) {
      playgroundSimRepo = repoKey;
      playgroundSimAgent = agentId;
      switchPage("playground");
    }

    function replayLogInPlayground(logId) {
      const ev = LOGS.find(l => l.id === logId);
      if (ev) {
        playgroundIntent = ev.title;
        if (ev.scope) {
          playgroundSimRepo = ev.scope.repo_id || (ev.scope.root ? "*" : "");
          playgroundSimAgent = ev.scope.agent || "*";
        }
      }
      switchPage("playground");
    }

    function openHookModal(agentId) {
      activeHookModalAgent = agentId || "claude";
      renderModals();
    }

    function submitAddRepoModal() {
      const nameEl = document.getElementById("proto-repo-name");
      const dirEl = document.getElementById("proto-repo-dir");
      const name = (nameEl ? nameEl.value : "").trim() || "my-service";
      const dir = (dirEl ? dirEl.value : "").trim() || ("/Users/dev/Developer/" + name + "/.git");
      const id = "repo-" + Date.now();
      REPOS.push({
        id,
        name,
        git_common_dirs: dir.endsWith(".git") ? [dir] : [],
        root_paths: dir.endsWith(".git") ? [] : [dir],
        remote_hint: ""
      });
      ensureScopeRule(id, "*", []);
      selectedScopeRepoKey = id;
      showAddRepoModal = false;
      render();
    }

    function renderModals() {
      const modalRoot = document.getElementById("modal-root");
      if (!modalRoot) return;
      if (activeHookModalAgent) {
        const snip = HOOK_SNIPPETS[activeHookModalAgent] || HOOK_SNIPPETS.claude;
        modalRoot.innerHTML = `
          <div class="modal-mask" onclick="activeHookModalAgent=null;renderModals();">
            <div class="modal-box" onclick="event.stopPropagation();">
              <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
                <strong style="font-size:15px;color:var(--ink-strong);">手动配置客户端 Hook（仓库身份识别）</strong>
                <button class="btn" style="padding:2px 8px;" onclick="activeHookModalAgent=null;renderModals();">关闭</button>
              </div>
              <div style="padding:18px 20px;display:flex;flex-direction:column;gap:14px;">
                <div class="segmented" style="align-self:flex-start;">
                  ${AGENTS.map(a => `<button class="seg-btn ${activeHookModalAgent===a.id?'active':''}" onclick="openHookModal('${a.id}')">${esc(a.label)}</button>`).join("")}
                </div>
                <div style="border:1px solid var(--border);border-radius:6px;padding:10px 14px;background:var(--bg-subtle);">
                  <div class="kv-row"><span class="kv-k">目标配置文件</span><span class="kv-v mono">${esc(snip.config_path)}</span></div>
                  <div class="kv-row"><span class="kv-k">MCP 接入地址</span><span class="kv-v mono">${esc(snip.mcp_url)}</span></div>
                  <div class="kv-row"><span class="kv-k">Hook 二进制</span><span class="kv-v mono">${esc(snip.hook_bin_path)}</span></div>
                </div>
                <div style="font-size:12.5px;color:var(--ink-muted);">${esc(snip.instructions)}</div>
                <div class="code-navy">
                  <div class="code-navy-hdr">
                    <span>${esc(snip.config_path)}</span>
                    <span style="cursor:pointer;color:#fff;" onclick="navigator.clipboard?.writeText(HOOK_SNIPPETS['${activeHookModalAgent}'].snippet);alert('已复制 Hook 配置片段')">复制片段</span>
                  </div>
                  <pre>${esc(snip.snippet)}</pre>
                </div>
              </div>
            </div>
          </div>
        `;
        return;
      }
      if (showAddRepoModal) {
        modalRoot.innerHTML = `
          <div class="modal-mask" onclick="showAddRepoModal=false;renderModals();">
            <div class="modal-box" style="max-width:480px;" onclick="event.stopPropagation();">
              <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
                <strong style="font-size:15px;color:var(--ink-strong);">添加绑定仓库</strong>
                <button class="btn" style="padding:2px 8px;" onclick="showAddRepoModal=false;renderModals();">关闭</button>
              </div>
              <div style="padding:18px 20px;display:flex;flex-direction:column;gap:12px;">
                <div>
                  <div style="font-size:12px;font-weight:600;margin-bottom:5px;">仓库名称</div>
                  <input id="proto-repo-name" class="input-line" placeholder="例如：payments-api" value="payments-api" />
                </div>
                <div>
                  <div style="font-size:12px;font-weight:600;margin-bottom:5px;">Git Common Dir 或目录根路径</div>
                  <input id="proto-repo-dir" class="input-line mono" value="/Users/dev/Developer/payments-api/.git" />
                </div>
                <div style="display:flex;justify-content:flex-end;gap:8px;padding-top:6px;">
                  <button class="btn" onclick="showAddRepoModal=false;renderModals();">取消</button>
                  <button class="btn btn-primary" onclick="submitAddRepoModal()">保存绑定</button>
                </div>
              </div>
            </div>
          </div>
        `;
        return;
      }
      modalRoot.innerHTML = "";
    }

    function toggleTool(id) {
      const t = TOOLS.find(x => x.id === id);
      if (t) t.enabled = !t.enabled;
      render();
    }

    function switchPage(p) {
      document.querySelector(`.nav-item[data-page="${p}"]`)?.click();
    }

    render();
  </script>
</body>
</html>
