    }

    function hasRequiredInputs(item) {
      return (item.inputs || []).some(i => i.required);
    }

    function handleMarketAddClick(id) {
      const item = findMarketItem(id);
      if (!item) return;
      if (!item.inputs || item.inputs.length === 0) {
        installMarketServer(item, {});
        return;
      }
      marketModalItem = item;
      marketModalValues = {};
      marketModalError = "";
      render();
    }

    function closeMarketModal() {
      marketModalItem = null;
      marketModalValues = {};
      marketModalError = "";
      render();
    }

    function updateMarketModalInput(key, val) {
      marketModalValues[key] = val;
      marketModalError = "";
    }

    function confirmMarketModalInstall() {
      if (!marketModalItem) return;
      for (const inp of marketModalItem.inputs || []) {
        if (inp.required && !(marketModalValues[inp.key] || "").trim()) {
          marketModalError = `请填写必填项：${inp.label}`;
          renderModals();
          return;
        }
      }
      const item = marketModalItem;
      const vals = { ...marketModalValues };
      marketModalItem = null;
      marketModalValues = {};
      marketModalError = "";
      installMarketServer(item, vals);
    }

    function installMarketServer(item, values) {
      installedMarketIds.add(item.id);
      saveInstalledMarketIds();
      if (!SERVICES.some(s => s.id === item.id)) {
        SERVICES.unshift({
          id: item.id,
          name: item.title,
          proto: item.transport === "http" ? "MCP Streamable HTTP" : "MCP Stdio",
          kind: item.transport === "http" ? "mcp_http" : "mcp_stdio",
          enabled: true,
          demo: false,
          tone: "ok",
          status: "在线",
          endpoint: item.endpoint || item.command || "",
          desc: item.description,
          healthMsg: "已同步工具列表"
        });
      }
      showToast(`已添加 ${item.title} 并同步至上游服务`);
      render();
    }

    function renderMarketIconHtml(item) {
      const fallback = esc((item.title || "?").slice(0, 1).toUpperCase());
      const isSvg = (item.icon || "").toLowerCase().endsWith(".svg");
      return `<div class="market-icon"><img class="${isSvg ? "svg-fit" : "raster"}" src="${esc(item.icon)}" alt="${esc(item.title)}" onerror="this.remove();this.parentNode.textContent='${fallback}';" /></div>`;
    }

    function renderMarketCard(item) {
      const isInstalled = installedMarketIds.has(item.id);
      const needsSecret = (item.inputs || []).some(i => i.secret);
      const needsConfig = (item.inputs || []).length > 0;

      let authChip = "";
      if (item.signIn) authChip = `<span class="tag-chip">需登录</span>`;
      else if (needsSecret) authChip = `<span class="tag-chip">需凭据</span>`;
      else if (needsConfig) authChip = `<span class="tag-chip">需参数</span>`;

      return `
        <div class="market-card">
          <div style="display:flex;flex-direction:column;gap:10px;">
            <div style="display:flex;align-items:center;gap:10px;">
              ${renderMarketIconHtml(item)}
              <div style="min-width:0;flex:1;">
                <div style="font-size:13.5px;font-weight:600;color:var(--ink-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(item.title)}</div>
                <div style="display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap;">
                  <span style="font-size:11.5px;color:var(--ink-muted);">${esc(item.publisher)}</span>
                  <span class="tag-chip">${esc(item.runs)}</span>
                  ${authChip}
                </div>
              </div>
            </div>
            <div class="market-desc">${esc(item.description)}</div>
          </div>

          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:4px;">
            <span class="mono" style="font-size:11.5px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(item.id)}</span>
            ${isInstalled
              ? `<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
                   <span class="quiet-meta" style="color:var(--success);font-weight:500;"><span class="dot dot-ok"></span>已接入</span>
                   <button class="btn btn-sm" type="button" onclick="selectedServiceId='${item.id}';switchPage('services')">查看</button>
                 </div>`
              : `<button class="btn btn-sm" type="button" onclick="handleMarketAddClick('${item.id}')">${item.signIn ? "登录并添加" : (needsConfig ? "添加…" : "添加")}</button>`}
          </div>
        </div>
      `;
    }

    function renderMarketModal() {
      if (!marketModalItem) return "";
      const item = marketModalItem;
      const targetStr = item.endpoint || item.command || "";
      const inputsHtml = (item.inputs || []).map(inp => `
        <div>
          <div class="field-label-row">
            <span class="field-label">${esc(inp.label)}${inp.required ? ' <span style="color:var(--danger);">*</span>' : ""}</span>
            <span class="tag-chip mono">${esc(inp.where)}</span>
          </div>
          ${inp.description ? `<div style="font-size:11.5px;color:var(--ink-muted);margin-bottom:5px;">${esc(inp.description)}</div>` : ""}
          <input class="input-line mono" type="${inp.secret ? "password" : "text"}" value="${esc(marketModalValues[inp.key] || "")}" placeholder="${esc(inp.placeholder || "")}" oninput="updateMarketModalInput('${esc(inp.key)}', this.value)" />
        </div>
      `).join("");

      return `
        <div class="modal-mask" onclick="if(event.target===this) closeMarketModal()">
          <div class="modal-box" style="max-width:480px;padding:20px;gap:14px;">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
              <div style="display:flex;align-items:center;gap:10px;">
                ${renderMarketIconHtml(item)}
                <div>
                  <div style="font-size:15px;font-weight:600;color:var(--ink-strong);">添加 ${esc(item.title)}</div>
                  <div style="font-size:12px;color:var(--ink-muted);">${esc(item.publisher)} · ${esc(item.runs)}</div>
                </div>
              </div>
              <button class="btn btn-sm" type="button" onclick="closeMarketModal()">关闭</button>
            </div>

            ${marketModalError ? `<div class="sail-alert err"><span>${esc(marketModalError)}</span></div>` : ""}

            <div class="mono" style="font-size:11.5px;color:var(--ink-muted);background:var(--bg-subtle);border:1px solid var(--border);border-radius:6px;padding:8px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
              ${esc(targetStr)}
            </div>

            ${inputsHtml}

            <div style="display:flex;justify-content:flex-end;gap:8px;padding-top:4px;">
              <button class="btn" type="button" onclick="closeMarketModal()">取消</button>
              <button class="btn btn-primary" type="button" onclick="confirmMarketModalInstall()">确认添加并同步工具</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderMarket() {
      const q = marketQuery.trim().toLowerCase();
      const matchesQuery = (m) => !q || (m.title + " " + m.id + " " + m.publisher + " " + m.description + " " + (m.endpoint || m.command || "")).toLowerCase().includes(q);
      const matchesFilter = (m) => {
        if (marketFilter === "http") return m.transport === "http";
        if (marketFilter === "stdio") return m.transport === "stdio";
        if (marketFilter === "installed") return installedMarketIds.has(m.id);
        return true;
      };

      const featuredMatches = MARKET_SERVERS.filter(m => matchesQuery(m) && matchesFilter(m));
      const registryMatches = (q || marketRegistrySearched) ? REGISTRY_RESULTS.filter(m => matchesQuery(m) && matchesFilter(m)) : [];

      const pill = (id, label) => `<button class="btn btn-sm ${marketFilter === id ? "btn-primary" : ""}" type="button" onclick="setMarketFilter('${id}')">${label}</button>`;

      return `
        <div class="section-header">
          <h1 class="section-title">MCP 市场</h1>
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="quiet-meta"><span class="dot dot-ok"></span>精选，以及官方 MCP Registry</span>
            <button class="btn btn-sm" type="button" onclick="refreshPrototypeState()">${svgIcon("refresh", 13)}<span>刷新</span></button>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <input id="market-search-input" class="input-line" style="flex:1;" value="${esc(marketQuery)}" onkeydown="if(event.key==='Enter'){marketRegistrySearched=true;render();}" oninput="updateMarketQuery(this.value)" placeholder="搜索 MCP 服务器 — GitHub、Postgres、Figma、URL 或包名…" />
            <button class="btn" type="button" onclick="marketRegistrySearched=true;showToast('已从官方 MCP Registry 检索');render();">搜索 Registry</button>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            ${pill("all", "全部")}
            ${pill("http", "云端 SaaS")}
            ${pill("stdio", "本地工具")}
            ${pill("installed", `已接入 (${installedMarketIds.size})`)}
          </div>
        </div>

        ${featuredMatches.length > 0 ? `
          <div class="market-grid">
            ${featuredMatches.map(renderMarketCard).join("")}
          </div>
        ` : (registryMatches.length === 0 ? `
          <div class="sail-empty" style="padding:36px 20px;">
            <div style="font-size:14px;font-weight:600;color:var(--ink-strong);">未找到匹配的 MCP 服务</div>
            <div style="font-size:12.5px;color:var(--ink-muted);">试试搜索 GitHub、Postgres、Figma 或直接去官方 Registry 搜索。</div>
            ${q ? `<button class="btn btn-sm" type="button" onclick="marketRegistrySearched=true;render();">去官方 MCP Registry 搜索</button>` : ""}
          </div>
        ` : "")}

        ${registryMatches.length > 0 ? `
          <div style="display:flex;flex-direction:column;gap:10px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <span style="font-size:12.5px;font-weight:600;color:var(--ink-body);">官方 MCP Registry 搜索结果</span>
              <span class="quiet-meta mono">registry.modelcontextprotocol.io</span>
            </div>
            <div class="market-grid">
              ${registryMatches.map(renderMarketCard).join("")}
            </div>
          </div>
        ` : ""}
      `;
    }

    function renderLogs() {
      const errorTotal = LOGS.filter(l => l.status === "error").length;
      const filtered = LOGS.filter(l => {
        if (logKindFilter !== "all" && l.kind !== logKindFilter) return false;
        if (logStatusFilter !== "all" && l.status !== logStatusFilter) return false;
        if (logSearch && !(l.title + " " + (l.err || "") + " " + (l.reason || "") + " " + JSON.stringify(l.scope || {})).toLowerCase().includes(logSearch.toLowerCase())) return false;
        return true;
      });
      const hasFilter = logKindFilter !== "all" || logStatusFilter !== "all" || logSearch.trim() !== "";
      const ev = filtered.find(l => l.id === selectedLogId) || filtered[0] || null;
      const sc = ev && ev.scope ? ev.scope : null;
      const canQuickBind = sc && sc.root && !sc.repo_id && !REPOS.some(r => r.root_paths.includes(sc.root) || r.name === sc.root.split("/").pop());
      const agentLabel = (id) => (AGENTS.find(a => a.id === id) || {}).label || id || "—";

      return `
        <div class="section-header">
          <h1 class="section-title">请求日志</h1>

            ${errorTotal > 0 ? `<span class="badge badge-err">错误 ${errorTotal}</span>` : ""}
            <button class="btn btn-sm" type="button" onclick="refreshPrototypeState()">${svgIcon("refresh", 13)}<span>刷新</span></button>
          </div>
        </div>

        <div class="card" style="padding:14px 18px;">

            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <input class="search" style="width:220px;" placeholder="搜索意图、工具名或载荷…" value="${esc(logSearch)}" oninput="logSearch=this.value;render();" />
              <div class="segmented">
                <button class="seg-btn ${logKindFilter==="all"?"active":""}" type="button" onclick="logKindFilter='all';render();">全部</button>
                <button class="seg-btn ${logKindFilter==="discover"?"active":""}" type="button" onclick="logKindFilter='discover';render();">discover</button>
                <button class="seg-btn ${logKindFilter==="invoke"?"active":""}" type="button" onclick="logKindFilter='invoke';render();">invoke</button>
              </div>
              <div class="segmented">
                <button class="seg-btn ${logStatusFilter==="all"?"active":""}" type="button" onclick="logStatusFilter='all';render();">全部</button>
                <button class="seg-btn ${logStatusFilter==="selected"?"active":""}" type="button" onclick="logStatusFilter='selected';render();">成功</button>
                <button class="seg-btn ${logStatusFilter==="no_match"?"active":""}" type="button" onclick="logStatusFilter='no_match';render();">未命中</button>
                <button class="seg-btn ${logStatusFilter==="error"?"active":""}" type="button" onclick="logStatusFilter='error';render();">错误</button>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              ${hasFilter ? `<button class="btn btn-sm" type="button" onclick="logSearch='';logKindFilter='all';logStatusFilter='all';render();">重置</button>` : ""}
              <span class="quiet-meta">${filtered.length} / ${LOGS.length}</span>
            </div>
          </div>
        </div>

        ${LOGS.length === 0 ? `
          <div class="sail-empty"><div style="font-weight:600;color:var(--ink-strong);">暂无请求记录</div><button class="btn btn-sm" type="button" onclick="switchPage('playground')">前往路由沙盒</button></div>
        ` : filtered.length === 0 ? `
          <div class="sail-empty"><div style="font-weight:600;color:var(--ink-strong);">无匹配日志</div><button class="btn btn-sm" type="button" onclick="logSearch='';logKindFilter='all';logStatusFilter='all';render();">清空筛选</button></div>
        ` : `
          <div class="master-detail logs-layout">
            <div class="card-flush">
              <div class="card-header" style="padding:14px 20px;border-bottom:1px solid var(--divider);">
                <h2 class="card-title">时间线</h2>
                <span class="quiet-meta">${filtered.length} 条</span>
              </div>
              <div style="max-height:660px;overflow-y:auto;">
                ${filtered.map(l => {
                  const dotCls = l.status === "error" ? "dot-err" : l.status === "no_match" ? "dot-warn" : "dot-ok";
                  return `
                    <div class="hairline-row ${ev && l.id === ev.id ? "selected" : ""}" onclick="selectedLogId='${l.id}';render();">
                      <div class="row-main">
                        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                          <div style="display:flex;align-items:center;gap:6px;">
                            <span class="dot ${dotCls}"></span>
                            <span class="quiet-meta mono" style="font-size:11.5px;">${esc(l.kind)}</span>
                            ${l.status === "error" ? `<span class="badge badge-err">错误</span>` : ""}
                          </div>
                          <span class="quiet-meta mono" style="font-size:11.5px;">${l.ms} ms · ${esc(l.time)}</span>
                        </div>
                        <div class="row-name" style="${l.kind === "discover" ? "font-family:var(--sans);font-weight:500;" : ""}">${esc(l.title)}</div>
                      </div>
                    </div>
                  `;
                }).join("")}
              </div>
            </div>

            ${ev ? `
              <div class="card">
                <div class="card-header" style="flex-wrap:wrap;">
                  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                    <span class="badge ${ev.status==="error"?"badge-err":ev.status==="no_match"?"badge-warn":"badge-ok"}">${ev.status==="selected"?"已命中":ev.status==="error"?"失败":"未命中"}</span>
                    <span class="quiet-meta mono">${esc(ev.kind)}</span>
                    <span class="quiet-meta mono" style="color:var(--ink-faint);">${esc(ev.id)}</span>
                  </div>
                  <div style="display:flex;gap:6px;">
                    ${ev.kind === "discover" ? `<button class="btn btn-sm" type="button" onclick="replayLogInPlayground('${ev.id}')">沙盒重放</button>` : ""}
                    ${ev.kind === "invoke" && TOOLS.some(t => t.id === ev.title) ? `<button class="btn btn-sm" type="button" onclick="selectedToolId='${ev.title}';switchPage('catalog');">查看契约</button>` : ""}
                    <button class="btn btn-sm" type="button" onclick="copyText(JSON.stringify(LOGS.find(x=>x.id==='${ev.id}'),null,2),'已复制事件 JSON')">复制 JSON</button>
                  </div>
                </div>

                <div style="font-size:15.5px;font-weight:600;color:var(--ink-strong);">${esc(ev.title)}</div>

                <div class="metric-tiles">
                  <div class="metric-tile"><span class="metric-tile-k">耗时</span><span class="metric-tile-v mono">${ev.ms} ms</span><span class="metric-tile-sub">${esc(ev.method || "tools/call")}</span></div>
                  <div class="metric-tile"><span class="metric-tile-k">Token</span><span class="metric-tile-v mono">${esc(ev.tokens || "0 tok")}</span><span class="metric-tile-sub">${ev.tokensIn ? `${ev.tokensIn} in · ${ev.tokensOut} out` : "直调无路由开销"}</span></div>
                  <div class="metric-tile"><span class="metric-tile-k">身份</span><span class="metric-tile-v mono">${esc(ev.actor)}</span><span class="metric-tile-sub">本机直连</span></div>
                  <div class="metric-tile"><span class="metric-tile-k">时间</span><span class="metric-tile-v mono">${esc(ev.time)}</span><span class="metric-tile-sub">${esc(ev.date || "2026-11-17")}</span></div>
                </div>

                <div class="card-subtle" style="gap:2px;">
                  <div class="kv-row"><span class="kv-k">路由模型</span><span class="kv-v mono">${esc(ev.model || "—")}</span></div>
                  <div class="kv-row"><span class="kv-k">候选收敛</span><span class="kv-v mono">${ev.eligible !== undefined ? `${ev.eligible} 候选 → ${(ev.tools || []).length} 下发` : "—"}</span></div>
                  <div class="kv-row"><span class="kv-k">元工具</span><span class="kv-v mono">${esc(ev.metaTool || "—")}</span></div>
                  <div class="kv-row"><span class="kv-k">客户端</span><span class="kv-v">${sc ? `${esc(agentLabel(sc.agent))} (${esc(sc.agent)})` : "—"}</span></div>
                </div>

                ${sc ? `
                  <div class="card-subtle" style="gap:4px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;gap:8px;">
                      <div style="display:flex;align-items:center;gap:8px;">
                        <span style="font-size:12px;font-weight:600;color:var(--ink-strong);">仓库作用域追踪</span>
                        <span class="badge ${sc.status === "matched" ? "badge-ok" : "badge-warn"}">${esc(sc.status)}</span>
                      </div>
                      <div style="display:flex;gap:6px;">
                        ${sc.repo_id ? `<button class="btn btn-sm" type="button" onclick="selectedScopeRepoKey='${sc.repo_id}';switchPage('repos');">仓库规则</button>` : ""}
                        ${canQuickBind ? `<button class="btn btn-sm" type="button" onclick="bindFromLog('${esc(sc.root)}')">绑定此仓库</button>` : ""}
                      </div>
                    </div>
                    <div class="kv-row"><span class="kv-k">客户端</span><span class="kv-v">${esc(agentLabel(sc.agent))} (${esc(sc.agent)})</span></div>
                    <div class="kv-row"><span class="kv-k">命中仓库</span><span class="kv-v">${esc(sc.repo_name || "未绑定仓库")}</span></div>
                    <div class="kv-row"><span class="kv-k">工作区根路径</span><span class="kv-v mono">${esc(sc.root || "—")}</span></div>
                    <div class="kv-row"><span class="kv-k">命中规则</span><span class="kv-v mono">${esc(sc.matched_rule || "—")}</span></div>
                  </div>
                ` : ""}

                ${ev.err ? `<div class="sail-alert err"><span>${esc(ev.err)}</span></div>` : ""}
                ${ev.reason ? `<div class="sail-alert info"><span>${esc(ev.reason)}</span></div>` : ""}

                <div style="display:flex;flex-direction:column;gap:8px;">
                  <div style="font-size:12.5px;font-weight:600;color:var(--ink-strong);">命中工具 (${(ev.tools || []).length})</div>
                  ${(ev.tools && ev.tools.length) ? `
                    <div class="card-flush">
                      ${ev.tools.map(t => `
                        <div class="hairline-row" style="cursor:default;">
                          <div class="row-main">
                            <div class="row-title-line">
                              <span class="row-name">${esc(t.id)}</span>
                              ${t.rw ? `<span class="badge badge-rw">写操作</span>` : ""}
                            </div>
                            <div class="row-summary">${esc(t.reason)}</div>
                          </div>
                          <div class="row-right">
                            <button class="btn btn-sm" type="button" onclick="selectedToolId='${t.id}';switchPage('catalog');">目录详情</button>
                          </div>
                        </div>
                      `).join("")}
                    </div>
                  ` : `<div class="quiet-meta">未命中候选工具</div>`}
                </div>

                <div style="display:flex;flex-direction:column;gap:8px;">
                  <div class="segmented" style="align-self:flex-start;">
                    <button class="seg-btn ${logPayloadTab==="event"?"active":""}" type="button" onclick="logPayloadTab='event';render();">完整事件 JSON</button>

                  <div class="code-navy">

                      <span>${logPayloadTab === "event" ? "EVENT JSON" : "DETAIL PAYLOAD"}</span>
                      <button class="endpoint-copy" style="color:#fff;" type="button" onclick="copyText(JSON.stringify(${logPayloadTab === "event" ? `LOGS.find(x=>x.id==='${ev.id}')` : `LOGS.find(x=>x.id==='${ev.id}').scope||{}`},null,2),'已复制载荷 JSON')">复制</button>
                    </div>
                    <pre>${esc(JSON.stringify(logPayloadTab === "event" ? ev : { scope: ev.scope, tools: ev.tools, reason: ev.reason, err: ev.err }, null, 2))}</pre>
                  </div>
                </div>
              </div>
            ` : ""}
          </div>
        `}
      `;
    }

    const PLAYGROUND_SAMPLES = [
      { label: "排查服务错误日志", intent: "排查 prod-core 下支付服务 Pod 频繁重启的原因" },
      { label: "查询服务归属团队", intent: "查询核心项目 Jira Issue 与近期负责团队" },
      { label: "查看近期部署版本", intent: "列出 mcp-gateway 仓库最近 Pull Request 与变更内容" }
    ];

    function runPlaygroundSample(idx) {
      const s = PLAYGROUND_SAMPLES[idx];
      if (s) {
        playgroundIntent = s.intent;
        render();
      }
    }

    function executePlaygroundInvoke(toolName) {
      playgroundInvokeResult = JSON.stringify({
        ok: true,
        tool: toolName,

    const SETTINGS_STORAGE_KEY = "mcp_gateway_proto_profiles_v2";
    const DEFAULT_MODELS = [
      { id: "m-openai", baseUrl: "https://api.openai.com/v1", modelId: "gpt-6-luna", hasKey: true, maxResults: 4, timeoutSec: 45, verifyIntent: "", active: true, savedAt: "22:54:48" },
      { id: "m-gemini", baseUrl: "https://generativelanguage.googleapis.com/v1beta", modelId: "gemini-decision-1", hasKey: true, maxResults: 4, timeoutSec: 45, verifyIntent: "", active: false, savedAt: "21:18:10" }
    ];

    function loadSavedModels() {
      try {
        const raw = localStorage.getItem(SETTINGS_STORAGE_KEY);
        if (!raw) return DEFAULT_MODELS.map(m => ({ ...m }));
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) && parsed.length ? parsed : DEFAULT_MODELS.map(m => ({ ...m }));
      } catch {
        return DEFAULT_MODELS.map(m => ({ ...m }));
      }
    }

    function persistModelsList() {
      try { localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(savedModels)); } catch {}
    }

    let savedModels = loadSavedModels();
    const initialActive = savedModels.find(m => m.active) || savedModels[0];
    let editingModelId = initialActive ? initialActive.id : null;
    let settingsDraft = {
      baseUrl: initialActive?.baseUrl || "",
      modelId: initialActive?.modelId || "",
      hasKey: Boolean(initialActive?.hasKey),
      apiKeyInput: "",
      maxResults: initialActive?.maxResults || 4,
      timeoutSec: initialActive?.timeoutSec || 45,
      verifyIntent: initialActive?.verifyIntent || ""
    };
    let settingsDirty = false;
    let advancedExpanded = false;
    let modelTestState = { status: "passed", message: `${settingsDraft.modelId} 已响应`, latencyMs: 342 };
    let routeVerifyState = { status: "idle", timestamp: initialActive?.savedAt || "22:54:48", latencyMs: 2112, tool: "github.add_comment_to_pending_review", detail: "相关性概率 95.5%" };

    function nowTimeStr() { return new Date().toTimeString().slice(0, 8); }

    function applyPreset(kind) {
      editingModelId = null;
      if (kind === "openai") {
        settingsDraft.baseUrl = "https://api.openai.com/v1";
        settingsDraft.modelId = "gpt-6-luna";
      } else {
        settingsDraft.baseUrl = "https://generativelanguage.googleapis.com/v1beta";
        settingsDraft.modelId = "gemini-decision-1";
      }
      settingsDirty = true;
      modelTestState = { status: "idle", message: "模型配置已变更，点击「测试连接」验证可用性", latencyMs: null };
      render();
    }

    function updateSettingField(field, value) {
      settingsDraft[field] = value;
      settingsDirty = true;
      if (field === "baseUrl" || field === "modelId" || field === "apiKeyInput") {
        modelTestState = { status: "idle", message: "模型配置已变更，点击「测试连接」验证可用性", latencyMs: null };
      }
    }

    function clearStoredApiKey() {
      settingsDraft.hasKey = false;
      settingsDraft.apiKeyInput = "";
      settingsDirty = true;
      modelTestState = { status: "idle", message: "API Key 已清除，请重新输入后测试连接", latencyMs: null };
      render();
    }

    function toggleAdvancedSettings() {
      advancedExpanded = !advancedExpanded;
      render();
    }

    function stepSetting(field, delta, min, max) {
      settingsDraft[field] = Math.min(max, Math.max(min, Number(settingsDraft[field] || min) + delta));
      settingsDirty = true;
      render();
    }

    function convergeAllReadOnly() {
      TOOLS.forEach(t => { if (t.rw) t.enabled = false; });
      showToast("已全局收敛为只读：关闭全部写操作工具");
      render();
    }

    function runModelTest() {
      const hasUrl = settingsDraft.baseUrl.trim().length > 0;
      const hasModel = settingsDraft.modelId.trim().length > 0;
      const hasAnyKey = settingsDraft.hasKey || settingsDraft.apiKeyInput.trim().length > 0;
      if (!hasUrl || !hasModel || !hasAnyKey) {
        modelTestState = { status: "error", message: !hasAnyKey ? "连接失败：请先输入 API Key" : "连接失败：请填写 Base URL 与 Model ID", latencyMs: null };
        render();
        return;
      }
      modelTestState = { status: "testing", message: "正在测试模型连接…", latencyMs: null };
      render();
      setTimeout(() => {
        const keyVal = settingsDraft.apiKeyInput.trim().toLowerCase();
        if (keyVal === "invalid" || settingsDraft.baseUrl.includes("invalid")) {
          modelTestState = { status: "error", message: "连接失败：401 Unauthorized（API Key 无效或无权访问该模型）", latencyMs: 218 };
        } else {
          modelTestState = { status: "passed", message: `${esc(settingsDraft.modelId.trim())} 已响应`, latencyMs: 240 + Math.floor(Math.random() * 200) };
        }
        render();
      }, 360);
    }

    function persistAllSettings() {
      const nextHasKey = settingsDraft.apiKeyInput.trim().length > 0 ? true : settingsDraft.hasKey;
      const baseUrl = settingsDraft.baseUrl.trim();
      const modelId = settingsDraft.modelId.trim();
      if (!baseUrl || !modelId) return null;
      const now = nowTimeStr();
      const existing = editingModelId ? savedModels.find(m => m.id === editingModelId) : savedModels.find(m => m.modelId === modelId && m.baseUrl === baseUrl);
      let targetId;
      if (existing) {
        existing.baseUrl = baseUrl; existing.modelId = modelId; existing.hasKey = nextHasKey;
        existing.maxResults = Math.min(12, Math.max(1, Number(settingsDraft.maxResults) || 4));
        existing.timeoutSec = Math.min(180, Math.max(5, Number(settingsDraft.timeoutSec) || 45));
        existing.verifyIntent = settingsDraft.verifyIntent.trim(); existing.savedAt = now;
        targetId = existing.id;
      } else {
        targetId = "m-" + Date.now();
        savedModels.unshift({ id: targetId, baseUrl, modelId, hasKey: nextHasKey, maxResults: Math.min(12, Math.max(1, Number(settingsDraft.maxResults) || 4)), timeoutSec: Math.min(180, Math.max(5, Number(settingsDraft.timeoutSec) || 45)), verifyIntent: settingsDraft.verifyIntent.trim(), active: true, savedAt: now });
      }
      savedModels.forEach(m => { m.active = (m.id === targetId); });
      editingModelId = targetId;
      settingsDraft.baseUrl = baseUrl; settingsDraft.modelId = modelId; settingsDraft.hasKey = nextHasKey; settingsDraft.apiKeyInput = ""; settingsDirty = false;
      persistModelsList();
      return savedModels.find(m => m.id === targetId);
    }

    function saveAllSettings() {
      if (modelTestState.status !== "passed") {
        modelTestState = { status: "error", message: "保存前请先点击「测试连接」并通过连通性校验", latencyMs: null };
        showToast("请先通过模型连通性测试后再保存");
        render();
        return;
      }
      const saved = persistAllSettings();
      if (!saved) modelTestState = { status: "error", message: "请填写 Base URL 与 Model ID 后再保存", latencyMs: null };
      else showToast(`已保存模型配置：${saved.modelId}`);
      render();
    }

    function activateSavedModel(id) {
      const target = savedModels.find(m => m.id === id);
      if (!target) return;
      savedModels.forEach(m => { m.active = (m.id === id); });
      persistModelsList();
      editSavedModel(id);
      showToast(`已切换当前路由模型为 ${target.modelId}`);
    }

    function editSavedModel(id) {
      const target = savedModels.find(m => m.id === id);
      if (!target) return;
      editingModelId = target.id;
      settingsDraft = { baseUrl: target.baseUrl, modelId: target.modelId, hasKey: Boolean(target.hasKey), apiKeyInput: "", maxResults: target.maxResults, timeoutSec: target.timeoutSec, verifyIntent: target.verifyIntent || "" };
      settingsDirty = false;
      modelTestState = { status: "idle", message: `已载入 ${esc(target.modelId)}，可点击测试连接`, latencyMs: null };
      render();
    }

    function deleteSavedModel(id) {
      const idx = savedModels.findIndex(m => m.id === id);
      if (idx === -1) return;
      const wasActive = savedModels[idx].active;
      savedModels.splice(idx, 1);
      if (wasActive && savedModels.length) savedModels[0].active = true;
      if (editingModelId === id && savedModels.length) editSavedModel(savedModels[0].id);
      persistModelsList();
      showToast("已删除保存的模型配置");
      render();
    }

    function saveAndRunRouteVerify() {
      const saved = persistAllSettings();
      if (!saved || !saved.hasKey) {
        routeVerifyState = { status: "error", timestamp: nowTimeStr(), latencyMs: null, tool: "", detail: "模型配置不完整（缺少 Base URL、Model ID 或 API Key），无法运行路由校验。" };
        render();
        return;
      }
      routeVerifyState = { status: "running", timestamp: nowTimeStr(), latencyMs: null, tool: "", detail: "" };
      render();
      setTimeout(() => {
        routeVerifyState = { status: "passed", timestamp: nowTimeStr(), latencyMs: 1280 + Math.floor(Math.random() * 650), tool: "k8s.describe_pod_events", detail: `意图「${esc(saved.verifyIntent || "默认语义路由探针")}」匹配成功` };
        modelTestState = { status: "passed", message: `${esc(saved.modelId)} 已响应`, latencyMs: 310 };
        render();
      }, 450);
    }

    function renderModelTestStatus() {
      if (modelTestState.status === "testing") return `<span class="quiet-meta"><span class="dot dot-warn"></span>正在测试模型连接…</span>`;
      if (modelTestState.status === "passed") return `<span class="quiet-meta" style="color:var(--success);font-weight:500;"><span class="dot dot-ok"></span>模型测试通过 · ${modelTestState.message} · ${modelTestState.latencyMs} ms</span>`;
      if (modelTestState.status === "error") return `<span class="quiet-meta" style="color:var(--danger);font-weight:500;"><span class="dot dot-err"></span>${modelTestState.message}</span>`;
      return `<span class="quiet-meta"><span class="dot dot-muted"></span>${modelTestState.message}</span>`;
    }

    function renderSettings() {
      const realEnabled = TOOLS.filter(t => !t.demo && t.enabled);
      const rwEnabledCount = realEnabled.filter(t => t.rw).length;
      const devTools = realEnabled.filter(t => t.actors.includes("developer"));
      const obsTools = realEnabled.filter(t => t.actors.includes("observer") && !t.rw);

        const counts = {};
        arr.forEach(t => { counts[t.server] = (counts[t.server] || 0) + 1; });
        return Object.entries(counts).map(([k, v]) => `${k.split(" ")[0]} ${v}`).join(" · ") || "—";
      };

      const hasConfiguredKey = settingsDraft.hasKey;
      const keyStatusHtml = hasConfiguredKey
        ? `<div style="display:flex;align-items:center;gap:8px;"><span class="quiet-meta"><span class="dot dot-ok"></span>已配置</span><button class="btn btn-sm" style="padding:2px 7px;font-size:11.5px;" type="button" onclick="clearStoredApiKey()">清除</button></div>`
        : `<span class="quiet-meta"><span class="dot dot-muted"></span>未配置</span>`;

      let verifyBoxHtml = "";
      if (routeVerifyState.status === "running") {

        verifyBoxHtml = `

            <div style="display:flex;width:100%;justify-content:space-between;"><strong>路由校验通过 · ${routeVerifyState.timestamp}</strong><span class="mono">${routeVerifyState.latencyMs} ms</span></div>
            <div><span class="mono" style="font-weight:600;">${routeVerifyState.tool}</span> — ${routeVerifyState.detail}</div>
          </div>`;
      } else if (routeVerifyState.status === "error") {
        verifyBoxHtml = `<div class="sail-alert err"><span>${routeVerifyState.detail}</span></div>`;
      }

      return `

          <h1 class="section-title">访问与路由</h1>
        </div>

              <button class="btn btn-sm" type="button" onclick="catalogAccessFilter='rw';switchPage('catalog');">审查写操作</button>
              ${rwEnabledCount > 0 ? `<button class="btn btn-sm btn-danger" type="button" onclick="convergeAllReadOnly()">全局收敛为只读</button>` : ""}
            </div>
          </div>
          <table class="simple">
            <thead>
              <tr><th>身份 Actor</th><th>可达服务</th><th>开放工具</th><th>只读</th><th>写操作 RW</th><th>服务分布</th></tr>
            </thead>
            <tbody>
              <tr>
                <td class="mono" style="font-weight:600;color:var(--ink-strong);">developer</td>
                <td>${new Set(devTools.map(t => t.serverId)).size}</td>

                <td>${new Set(obsTools.map(t => t.serverId)).size}</td>

                <td>${obsTools.length}</td>
                <td style="color:var(--ink-muted);">0</td>
                <td class="quiet-meta" style="display:table-cell;">${esc(srvDist(obsTools))}</td>

    function addGrant(repoKey, serverId) {
      const rule = ensureScopeRule(repoKey, []);
      if (!rule.grants.some(g => g.server_id === serverId)) rule.grants.push({ server_id: serverId, access: "ro", tool_ids: [] });
      repoDraftDirty = true;
      render();
    }

    function removeGrant(repoKey, serverId) {
      const rule = ensureScopeRule(repoKey, []);
      rule.grants = rule.grants.filter(g => g.server_id !== serverId);
      repoDraftDirty = true;
      render();
    }

    function restoreRepoInherit(repoKey) {
      SCOPE_RULES = SCOPE_RULES.filter(r => r.repo_key !== repoKey);
      repoDraftDirty = false;
      showToast("已恢复继承全局默认服务");
      render();
    }

    function setGrantAccess(repoKey, serverId, access) {
      const rule = ensureScopeRule(repoKey, []);
      const g = rule.grants.find(x => x.server_id === serverId);
      if (g) g.access = access;
      repoDraftDirty = true;
      render();
    }

    function toggleGrantTool(repoKey, serverId, toolId) {
      const rule = ensureScopeRule(repoKey, []);
      const g = rule.grants.find(x => x.server_id === serverId);
      if (!g) return;
      const allIds = (SERVICE_TOOLS[serverId] || []).map(t => t.id);
      let current = (g.tool_ids && g.tool_ids.length) ? [...g.tool_ids] : [...allIds];
      if (current.includes(toolId)) current = current.filter(x => x !== toolId);
      else current.push(toolId);
      g.tool_ids = current.length === allIds.length ? [] : current;
      repoDraftDirty = true;
      render();
    }

    function resetGrantTools(repoKey, serverId) {
      const rule = findScopeRule(repoKey);
      const g = rule && rule.grants.find(x => x.server_id === serverId);
      if (g) g.tool_ids = [];
      repoDraftDirty = true;
      render();
    }

    function bindObservedRepo(fp) {
      const obs = OBSERVED_REPOS.find(o => o.fingerprint === fp);
      if (!obs) return;
      const newId = "repo-" + obs.name.toLowerCase().replace(/[^a-z0-9]+/g, "-");
      REPOS.push({ id: newId, name: obs.name, git_common_dirs: obs.git_common_dir ? [obs.git_common_dir] : [], root_paths: [obs.root], remote_hint: obs.remote_hint || "" });
      ensureScopeRule(newId, []);
      OBSERVED_REPOS = OBSERVED_REPOS.filter(o => o.fingerprint !== fp);
      selectedScopeRepoKey = newId;
      showToast(`已绑定仓库 ${obs.name}`);
      render();
    }

    function bindFromLog(rootPath) {
      const name = rootPath.split("/").filter(Boolean).pop() || "bound-repo";
      const obs = OBSERVED_REPOS.find(o => o.root === rootPath);
      if (obs) {
        bindObservedRepo(obs.fingerprint);
        switchPage("repos");
        return;
      }
      const newId = "repo-" + name.toLowerCase();
      REPOS.push({ id: newId, name, git_common_dirs: [rootPath + "/.git"], root_paths: [rootPath], remote_hint: "" });
      ensureScopeRule(newId, []);
      selectedScopeRepoKey = newId;
      showToast(`已绑定仓库 ${name}`);
      switchPage("repos");
    }

    function deleteBoundRepo(id) {
      const idx = REPOS.findIndex(r => r.id === id);
      if (idx >= 0) REPOS.splice(idx, 1);
      SCOPE_RULES = SCOPE_RULES.filter(r => r.repo_key !== id);
      selectedScopeRepoKey = REPOS[0] ? REPOS[0].id : "*";
      confirmRemoveRepoId = null;
      showToast("已移除仓库绑定");
      render();
    }

    function replayLogInPlayground(logId) {
      const ev = LOGS.find(l => l.id === logId);
      if (ev) {
        playgroundIntent = ev.title;
        if (ev.scope) {
          playgroundSimRepo = ev.scope.repo_id || (ev.scope.root ? "*" : "");
        }
      }
      switchPage("playground");
    }

        return;
      }
      if (currentPage === "overview" && overviewDrawer) {
        const agentLabel = (id) => (AGENTS.find(a => a.id === id) || {}).label || id || "客户端";
        let hdr = "";
        let body = "";
        let ftrAction = "";

        if (overviewDrawer.type === "log") {
          const ev = LOGS.find(l => l.id === overviewDrawer.id);
          if (ev) {
            const stText = ev.status === "selected" ? "成功命中" : ev.status === "error" ? "调用失败" : "未命中工具";
            const dotCls = ev.status === "selected" ? "ok" : ev.status === "error" ? "err" : "warn";
            const canBind = ev.scope && ev.scope.root && !ev.scope.repo_id && !REPOS.some(r => r.root_paths.includes(ev.scope.root));
            hdr = `<span class="dot dot-${dotCls}"></span><span>请求详情</span>`;
            body = `
              <div>
                <div style="font-size:15px;font-weight:600;color:var(--ink-strong);line-height:1.4;">${esc(ev.title)}</div>
                <div class="quiet-meta" style="margin-top:4px;">${esc(ev.kind === "discover" ? "路由发现" : "工具执行")} · ${esc(stText)} · ${ev.ms} ms · ${esc(ev.time)}</div>
              </div>
              <div class="card-subtle" style="gap:4px;">
                <div class="kv-row"><span class="kv-k">状态</span><span class="kv-v">${esc(stText)}</span></div>
                ${ev.scope ? `<div class="kv-row"><span class="kv-k">客户端</span><span class="kv-v">${esc(agentLabel(ev.scope.agent))}</span></div>` : ""}
                ${ev.scope ? `<div class="kv-row"><span class="kv-k">仓库</span><span class="kv-v mono">${esc(ev.scope.repo_name || ev.scope.root)}</span></div>` : ""}
                ${ev.tokens ? `<div class="kv-row"><span class="kv-k">路由 Token</span><span class="kv-v mono">${esc(ev.tokens)}</span></div>` : ""}
              </div>
              ${ev.err ? `<div class="sail-alert err"><span>${esc(ev.err)}</span></div>` : ""}
              ${ev.reason ? `<div class="sail-alert info"><span>${esc(ev.reason)}</span></div>` : ""}
              ${(ev.tools && ev.tools.length) ? `
                <div>
                  <div style="font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:8px;">命中工具</div>
                  <div class="card-flush">
                    ${ev.tools.map(t => `<div class="hairline-row" style="cursor:default;"><div class="row-main"><div class="row-name">${esc(t.id)}</div><div class="row-summary">${esc(t.reason)}</div></div></div>`).join("")}
                  </div>
                </div>
              ` : ""}
            `;
            ftrAction = `
              <div style="display:flex;gap:8px;">
                ${canBind ? `<button class="btn btn-sm" type="button" onclick="closeOverviewDrawer();bindFromLog('${esc(ev.scope.root)}');">绑定此仓库</button>` : ""}
                ${ev.kind === "discover" ? `<button class="btn btn-sm" type="button" onclick="closeOverviewDrawer();replayLogInPlayground('${ev.id}');">沙盒重放</button>` : ""}
                <button class="btn btn-sm" type="button" onclick="selectedLogId='${ev.id}';closeOverviewDrawer();switchPage('logs');">日志详情 ${svgIcon("arrowUpRight", 12)}</button>
              </div>
            `;
          }
        } else if (overviewDrawer.type === "service") {
          const s = SERVICES.find(x => x.id === overviewDrawer.id);
          if (s) {
            const tools = TOOLS.filter(t => t.serverId === s.id);
            const fallbackTools = tools.length ? tools : (SERVICE_TOOLS[s.id] || []);
            const st = getServiceToolStats(s.id);
            const r = evaluateServiceReadiness(s);
            const alertTone = (r.kind === "missing_creds" || r.kind === "conn_error" || r.kind === "invoke_error") ? "err" : "warn";
            hdr = `<span class="dot dot-${r.dot}"></span><span>${esc(s.name)}</span>`;
            body = `
              ${r.alertTitle ? `<div class="sail-alert ${alertTone}"><div><strong>${esc(r.alertTitle)}</strong>${r.alertDetail ? `<div style="margin-top:2px;font-size:12px;">${esc(r.alertDetail)}</div>` : ""}</div></div>` : ""}
              <div class="card-subtle" style="gap:4px;">
                <div class="kv-row"><span class="kv-k">协议</span><span class="kv-v">${esc(s.proto)}</span></div>
                <div class="kv-row"><span class="kv-k">当前可用状态</span><span class="kv-v" style="${r.dot === "err" ? "color:var(--danger);" : (r.dot === "warn" ? "color:var(--warning);" : "")}">${esc(r.label)}</span></div>
                <div class="kv-row"><span class="kv-k">启用开关</span><span class="kv-v">${s.enabled ? "已启用" : "已停用"}</span></div>
                <div class="kv-row"><span class="kv-k">最近检查</span><span class="kv-v mono">${esc(r.checkLabel)}</span></div>
                <div class="kv-row"><span class="kv-k">开放工具</span><span class="kv-v mono">${st.open}/${st.total}</span></div>
              </div>
              ${renderDescriptionDetail("ov-srv-" + s.id, s.desc)}
              <div>
                <div style="font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:8px;">下属工具</div>
                <div class="card-flush">
                  ${fallbackTools.map(t => `
                    <div class="hairline-row" style="cursor:default;">
                      <div class="row-main"><span class="row-name">${esc(t.name)}</span></div>
                      <div class="row-right">${t.rw ? `<span class="badge badge-rw">写</span>` : ""}</div>
                    </div>
                  `).join("")}
                </div>
              </div>
            `;
            ftrAction = `<button class="btn btn-sm" type="button" onclick="selectedServiceId='${s.id}';serviceDetailTab='${r.kind === "missing_creds" ? "config" : "whitelist"}';closeOverviewDrawer();switchPage('services');">${r.kind === "missing_creds" ? "填写凭据" : "管理此服务"} ${svgIcon("arrowUpRight", 12)}</button>`;
          }
        } else if (overviewDrawer.type === "tool") {
          const t = TOOLS.find(x => x.id === overviewDrawer.id);
          if (t) {
            hdr = `<span>工具详情</span>`;
            body = `
              <div>
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                  <span class="mono" style="font-size:15px;font-weight:600;color:var(--ink-strong);">${esc(t.name)}</span>
                  ${t.rw ? `<span class="badge badge-rw">写操作</span>` : `<span class="quiet-meta">只读</span>`}
                </div>
                <div class="quiet-meta" style="margin-top:4px;">${esc(t.server)} · 累计调用 ${t.hits} 次 · ${t.enabled ? "已开放" : "已禁用"}</div>
              </div>
              ${renderDescriptionDetail("ov-tool-" + t.id, t.rawDescription)}
              <div class="code-navy">
                <div class="code-navy-hdr"><span>INPUT SCHEMA</span><button class="endpoint-copy" style="color:#fff;" type="button" onclick="copyText(TOOLS.find(x=>x.id==='${t.id}').schema,'已复制 Schema')">复制</button></div>
                <pre>${esc(t.schema || "{}")}</pre>
              </div>
            `;
            ftrAction = `
              <div style="display:flex;gap:8px;">
                <button class="btn btn-sm" type="button" onclick="playgroundIntent='使用 ${esc(t.name)}';closeOverviewDrawer();switchPage('playground');">沙盒测试</button>
                <button class="btn btn-sm" type="button" onclick="selectedToolId='${t.id}';closeOverviewDrawer();switchPage('catalog');">工具目录 ${svgIcon("arrowUpRight", 12)}</button>
              </div>
            `;
          }
        }

        if (body) {
          modalRoot.innerHTML = `
            <div class="slide-drawer-mask" onclick="closeOverviewDrawer()">
              <div class="slide-drawer" onclick="event.stopPropagation();">
                <div class="slide-drawer-hdr">
                  <div style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink-strong);">${hdr}</div>
                  <button class="btn btn-sm" type="button" onclick="closeOverviewDrawer()">关闭</button>
                </div>
                <div class="slide-drawer-body">${body}</div>
                <div class="slide-drawer-ftr">
                  <span class="quiet-meta">按 Esc 关闭</span>
                  ${ftrAction}
                </div>
              </div>
            </div>
          `;
          return;
        }
      }
      modalRoot.innerHTML = "";
    }

    function toggleTool(id) {
      const t = TOOLS.find(x => x.id === id);
      if (t) {
        t.enabled = !t.enabled;
        showToast(`${t.enabled ? "已开放" : "已关闭"} ${t.name}`);
      }
      render();
    }

    function switchPage(p) {
      document.querySelector(`.nav-item[data-page="${p}"]`)?.click();
    }

    hydrateShellIcons();
    render();
  </script>
</body>
</html>
