<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MCP Gateway Control Plane — Minimalist Polish Prototype</title>
  <style>
    :root {
      --bg-canvas: #ffffff;
      --bg-sidebar: #f7fafc;
      --bg-subtle: #f7fafc;
      --bg-muted: #eef2f6;
      --bg-hover: #f3f6f9;
      --navy-bg: #0a2540;
      --navy-hdr: #0d2e4d;
      --navy-text: #e6edf5;
      --navy-muted: #93a7be;
      --ink-strong: #1a1f36;
      --ink-body: #3c4257;
      --ink-muted: #697386;
      --ink-faint: #8792a2;
      --border: #e3e8ee;
      --border-strong: #cbd5e1;
      --accent: #635bff;
      --accent-soft: #f5f6ff;
      --accent-border: #d5d2ff;
      --success: #0e6245;
      --success-bg: #dcfce7;
      --success-border: #a7f3d0;
      --warning: #92400e;
      --warning-bg: #fef3c7;
      --warning-border: #fde68a;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
      --danger-border: #fecaca;
      --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: var(--sans);
      background: var(--bg-canvas);
      color: var(--ink-body);
      font-size: 13.5px;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 236px;
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 12px 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 4px 8px 14px;
    }
    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      display: grid;
      place-items: center;
      color: var(--accent);
      font-weight: 700;
      font-size: 12px;
    }
    .brand-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink-strong);
      letter-spacing: -0.01em;
    }
    .nav-groups {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding-top: 4px;
    }
    .nav-heading {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-faint);
      padding: 0 10px 4px;
      letter-spacing: 0.02em;
    }
    .nav-item {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 6px;
      padding: 7px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      color: var(--ink-body);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      text-align: left;
    }
    .nav-item:hover { background: var(--bg-muted); }
    .nav-item.active {
      background: var(--bg-canvas);
      border-color: var(--border);
      color: var(--ink-strong);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }
    .nav-item-left { display: flex; align-items: center; gap: 8px; }
    .nav-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--ink-faint);
      opacity: 0.55;
    }
    .nav-item.active .nav-dot { background: var(--accent); opacity: 1; }
    .nav-count {
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      color: var(--ink-faint);
      font-weight: 600;
    }
    .nav-item.active .nav-count { color: var(--accent); }

    .endpoint-box {
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px 11px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .endpoint-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-strong);
    }
    .endpoint-url {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main Workspace */
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg-canvas);
    }
    .topbar {
      height: 50px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .bc-muted { color: var(--ink-muted); }
    .bc-sep { color: var(--ink-faint); }
    .bc-active { color: var(--ink-strong); font-weight: 600; }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .viewport {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
    }
    .container {
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Typography & Section Header */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .section-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--ink-strong);
      letter-spacing: -0.02em;
      margin: 0;
    }
    .card {
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card-flush {
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .card-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--ink-strong);
      margin: 0;
    }

    /* Hairline Rows (replaces nested cards) */
    .hairline-row {
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .hairline-row:last-child { border-bottom: none; }
    .hairline-row:hover { background: var(--bg-hover); }
    .hairline-row.selected { background: var(--accent-soft); }
    .row-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .row-title-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }
    .row-name {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-strong);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hairline-row.selected .row-name { color: var(--accent); }
    .row-sub {
      font-size: 12px;
      color: var(--ink-faint);
      white-space: nowrap;
    }
    .row-summary {
      font-size: 12.5px;
      color: var(--ink-muted);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .row-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    /* Quiet Meta & De-noised Badges */
    .quiet-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .dot-ok { background: var(--success); }
    .dot-warn { background: #d97706; }
    .dot-err { background: var(--danger); }
    .dot-muted { background: var(--ink-faint); }

    .badge-rw {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: var(--warning-bg);
      color: var(--warning);
      border: 1px solid var(--warning-border);
      letter-spacing: 0.02em;
    }
    .badge-err {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }

    /* Controls */
    .btn {
      border: 1px solid var(--border);
      background: var(--bg-canvas);
      color: var(--ink-body);
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 12.5px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .btn-primary:hover { background: #5248f5; }
    .btn-pill {
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      background: var(--bg-subtle);
    }
    .btn-toggle-active {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent);
      font-weight: 600;
    }

    .segmented {
      display: inline-flex;
      background: var(--bg-muted);
      padding: 2px;
      border-radius: 6px;
      gap: 2px;
    }
    .seg-btn {
      border: none;
      background: transparent;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--ink-muted);
      border-radius: 5px;
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
    }
    .seg-btn.active {
      background: var(--bg-canvas);
      color: var(--ink-strong);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
    }

    .search {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12.5px;
      color: var(--ink-strong);
      background: var(--bg-canvas);
      width: 240px;
      font-family: inherit;
    }
    .search:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

    .switch {
      width: 30px;
      height: 17px;
      border-radius: 999px;
      background: var(--border-strong);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      border: none;
      padding: 0;
    }
    .switch.on { background: var(--accent); }
    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 13px;
      height: 13px;
      border-radius: 999px;
      background: #fff;
      transition: transform 0.14s ease;
    }
    .switch.on::after { transform: translateX(13px); }

    /* Grids & Splits */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }
    .kpi-card {
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .kpi-label { font-size: 12px; font-weight: 600; color: var(--ink-muted); }
    .kpi-val { font-size: 23px; font-weight: 700; color: var(--ink-strong); font-variant-numeric: tabular-nums; }
    .kpi-hint { font-size: 12px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }

    .two-col {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 20px;
      align-items: start;
    }
    .master-detail {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 20px;
      align-items: start;
    }
    .master-detail.logs-layout {
      grid-template-columns: 380px minmax(0, 1fr);
    }

    /* Structured Description Block */
    .desc-structured {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .desc-lead {
      font-size: 13px;
      line-height: 1.55;
      color: var(--ink-body);
      margin: 0;
    }
    .desc-bullets {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .desc-bullets li {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--ink-body);
    }
    .desc-bullets li::before {
      content: "•";
      color: var(--ink-faint);
      font-weight: 700;
      flex-shrink: 0;
    }
    .arg-name {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-strong);
      background: var(--bg-muted);
      padding: 1px 5px;
      border-radius: 4px;
      margin-right: 4px;
    }
    .raw-wall {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-family: var(--mono);
      font-size: 11.5px;
      line-height: 1.5;
      color: var(--ink-muted);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .raw-toggle {
      align-self: flex-start;
      background: none;
      border: none;
      padding: 0;
      color: var(--accent);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .code-navy {
      background: var(--navy-bg);
      color: var(--navy-text);
      border-radius: 7px;
      overflow: hidden;
      font-family: var(--mono);
      font-size: 12px;
    }
    .code-navy-hdr {
      background: var(--navy-hdr);
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--navy-muted);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      justify-content: space-between;
    }
    .code-navy pre {
      margin: 0;
      padding: 12px;
      overflow-x: auto;
      line-height: 1.55;
    }

    .kv-row {
      display: flex;
      gap: 12px;
      padding: 5px 0;
      font-size: 12.5px;
    }
    .kv-k { width: 108px; flex-shrink: 0; color: var(--ink-muted); }
    .kv-v { color: var(--ink-strong); min-width: 0; word-break: break-all; }
    .mono { font-family: var(--mono); }

    .before-banner {
      background: var(--warning-bg);
      border: 1px solid var(--warning-border);
      color: var(--warning);
      padding: 9px 14px;
      border-radius: 7px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    table.simple {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }
    table.simple th {
      text-align: left;
      padding: 10px 14px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-muted);
      background: var(--bg-subtle);
      border-bottom: 1px solid var(--border);
    }
    table.simple td {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--ink-body);
      font-variant-numeric: tabular-nums;
    }
    table.simple tr:last-child td { border-bottom: none; }
    textarea.input-area, input.input-line {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 13px;
      color: var(--ink-strong);
      background: var(--bg-canvas);
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div>
        <div class="brand">
          <div class="brand-icon">M</div>
          <div class="brand-title">MCP Gateway</div>
        </div>
        <div class="nav-groups">
          <div>
            <div class="nav-heading">控制面</div>
            <button class="nav-item" data-page="overview"><span class="nav-item-left"><span class="nav-dot"></span>运行大盘</span></button>
            <button class="nav-item" data-page="services"><span class="nav-item-left"><span class="nav-dot"></span>上游服务</span><span class="nav-count">3</span></button>
            <button class="nav-item active" data-page="catalog"><span class="nav-item-left"><span class="nav-dot"></span>工具目录</span><span class="nav-count">18/26</span></button>
            <button class="nav-item" data-page="settings"><span class="nav-item-left"><span class="nav-dot"></span>访问与路由</span></button>
          </div>
          <div>
            <div class="nav-heading">观测与诊断</div>
            <button class="nav-item" data-page="logs"><span class="nav-item-left"><span class="nav-dot"></span>请求日志</span><span class="nav-count">42</span></button>
            <button class="nav-item" data-page="playground"><span class="nav-item-left"><span class="nav-dot"></span>路由沙盒</span></button>
          </div>
        </div>
      </div>

      <div class="endpoint-box">
        <div class="endpoint-top">
          <span class="quiet-meta"><span class="dot dot-ok"></span>监听中</span>
          <button class="btn" style="padding:2px 7px;font-size:11px;" onclick="alert('已复制 http://127.0.0.1:8788/mcp')">复制</button>
        </div>
        <div class="endpoint-url">http://127.0.0.1:8788/mcp</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="breadcrumb">
          <span class="bc-muted">控制面</span>
          <span class="bc-sep">/</span>
          <span class="bc-active" id="bc-title">工具目录</span>
        </div>
        <div class="topbar-actions">
          <button id="mode-toggle" class="btn btn-pill btn-toggle-active" onclick="toggleCompareMode()">
            当前视图：重构后（Description 清洗 + 降噪）
          </button>
          <span class="btn btn-pill" style="cursor:default;">
            <span class="dot dot-ok"></span>
            <span class="mono" style="font-size:12px;">gpt-6-luna</span>
          </span>
          <button class="btn" onclick="render()">刷新</button>
          <button class="btn" onclick="alert('接入客户端配置')">接入客户端</button>
        </div>
      </header>

      <main class="viewport">
        <div class="container" id="page-root"></div>
      </main>
    </div>
  </div>

  <script>
    let currentPage = "catalog";
    let compareRawMode = false; // false = Polished (Cleaned), true = Before (Raw text wall)
    let selectedToolId = "github.create_or_update_file";
    let selectedLogId = "ev-101";
    let catalogAccessFilter = "all";
    let catalogSearch = "";
    let showRawInDrawer = {};

    const TOOLS = [
      {
        id: "github.create_or_update_file",
        name: "create_or_update_file",
        server: "GitHub MCP",
        rw: true,
        enabled: true,
        hits: 14,
        actors: ["developer"],
        tags: ["github", "repo", "write"],
        rawDescription: `Create or update a single file in a GitHub repository.
**Note:** Requires write permissions on target branch; commits directly when no PR branch is provided.

Args:
  owner: Repository owner (username or organization)
  repo: Repository name without .git suffix
  path: File path inside the repository
  message: Conventional commit message
  content: UTF-8 text or base64 encoded file payload
  branch: Optional target branch name (defaults to default branch)

Returns:
  JSON object containing commit SHA, content metadata, and html_url.

Example:
  {"owner": "acme", "repo": "gateway", "path": "README.md", "message": "docs: update", "content": "..."}`
      },
      {
        id: "k8s.describe_pod_events",
        name: "describe_pod_events",
        server: "K8s Diagnostics",
        rw: false,
        enabled: true,
        hits: 29,
        actors: ["developer", "observer"],
        tags: ["k8s", "observability"],
        rawDescription: `### 查询 Kubernetes Pod 事件与异常诊断
用于检索指定 namespace 下 Pod 的最近 Warning 事件、OOMKilled 退出码与容器重启堆栈。
- \`namespace\`: 必填，目标命名空间（如 prod-core、staging）
- \`pod_name\`: Pod 名称前缀，支持模糊匹配
* \`since_minutes\`: 回溯时间窗口，默认 30 分钟
1. 默认最多返回最近 50 条关键事件，按时间倒序排列`
      },
      {
        id: "jira.search_issues_jql",
        name: "search_issues_jql",
        server: "Jira Cloud",
        rw: false,
        enabled: true,
        hits: 9,
        actors: ["developer", "observer"],
        tags: ["jira", "issue"],
        rawDescription: `Search Jira issues using **JQL** (Jira Query Language) across engineering projects. Supports filtering by assignee, sprint, label, and priority.

Parameters:
- jql (string): Valid JQL query string (e.g. project = CORE AND status != Done)
- maxResults (integer): Page size limit between 1 and 100
- fields (array): Optional subset of fields to return for lower token usage`

    function stripMd(s) {
      return s
        .replace(/^#{1,6}\s+/, "")
        .replace(/\*\*(.*?)\*\*/g, "$1")
        .replace(/__(.*?)__/g, "$1")
        .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
        .replace(/`([^`]+)`/g, "$1")
        .trim();
    }

    function parseRichDescription(raw) {
      const text = (raw || "").replace(/\r\n/g, "\n").trim();
      if (!text) return { summary: "", lead: "", bullets: [], raw: "", hasMore: false };
      const lines = text.split("\n");
      let leadParts = [];
      let bullets = [];
      let inArgs = false;
      let inExtra = false;
      let sawLeadBlank = false;
      let hasMore = false;

      for (const rawLine of lines) {
        const trimmed = rawLine.trim();
        if (!trimmed) {
          if (leadParts.length > 0 && !inArgs) sawLeadBlank = true;
          continue;
        }
        const lower = trimmed.toLowerCase();
        if (/^(args|arguments|parameters|params|inputs|参数|参数说明)\s*[:：]?$/.test(lower)) {
          inArgs = true;
          inExtra = false;
          continue;
        }
        if (/^(returns|return|outputs?|examples?|notes?|返回值|示例|注意)\s*[:：]?$/.test(lower)) {
          inExtra = true;
          inArgs = false;
          hasMore = true;
          continue;
        }
        if (inExtra) {
          hasMore = true;
          continue;
        }
        const bulletMatch = trimmed.match(/^(?:[-*•]|\d+[.)])\s+(.*)$/);
        if (bulletMatch) {
          bullets.push(stripMd(bulletMatch[1]));
          continue;
        }
        if (inArgs) {
          bullets.push(stripMd(trimmed));
          continue;
        }
        if (sawLeadBlank && leadParts.length > 0) {
          hasMore = true;
          continue;
        }
        leadParts.push(stripMd(trimmed));
      }

      const lead = leadParts.join(" ").replace(/\s+/g, " ").trim();
      let summary = lead || (bullets[0] || "");
      const m = summary.match(/^(.+?[。！？!?]|.+?\.\s)/);
      if (m) summary = m[1].trim();
      if (summary.length > 100) summary = summary.slice(0, 99) + "…";
      if (bullets.length > 6) hasMore = true;
      return { summary, lead, bullets, raw: text, hasMore };
    }

    function renderBulletHTML(b) {

      return `<li><span>${esc(b)}</span></li>`;

              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header"><h2 class="card-title mono">describe_pod_events</h2><span class="quiet-meta">RO</span></div>
            <div class="desc-structured">
              <p class="desc-lead">${esc(parsed.lead)}</p>
              <ul class="desc-bullets">${parsed.bullets.map(renderBulletHTML).join("")}</ul>
            </div>
            <div class="code-navy">
              <div class="code-navy-hdr"><span>INPUT SCHEMA</span><span>复制</span></div>
              <pre>{\n  "type": "object",\n  "properties": {\n    "namespace": { "type": "string" },\n    "pod_name": { "type": "string" }\n  },\n  "required": ["namespace"]\n}</pre>
            </div>
          </div>
        </div>
      `;
    }

    function renderSettings() {
      return `
        <div class="section-header">
          <h1 class="section-title">访问与路由</h1>
          <span class="badge-rw">已开放 2 个 RW 写工具</span>
        </div>

        <div class="card-flush">
          <div class="card-header" style="padding:16px 20px;border-bottom:1px solid var(--border);">
            <h2 class="card-title">调用身份护栏矩阵</h2>
            <button class="btn">审查写工具 (2)</button>
          </div>
          <table class="simple">
            <thead>
              <tr><th>Actor</th><th>可达服务</th><th>开放工具</th><th>只读</th><th>写操作 RW</th></tr>
            </thead>
            <tbody>
              <tr><td class="mono" style="font-weight:600;color:var(--ink-strong);">developer</td><td>3</td><td>18</td><td>16</td><td style="color:var(--warning);font-weight:600;">2</td></tr>
              <tr><td class="mono" style="font-weight:600;color:var(--ink-strong);">observer</td><td>3</td><td>16</td><td>16</td><td style="color:var(--ink-muted);">0</td></tr>
            </tbody>
          </table>
        </div>

        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Decisions 语义路由模型</h2>
            <span class="quiet-meta"><span class="dot dot-ok"></span>Key 已就绪</span>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
            <div>
              <div style="font-size:12px;font-weight:600;margin-bottom:5px;">Base URL</div>
              <input class="input-line mono" value="https://api.openai.com/v1" />
            </div>
            <div>
              <div style="font-size:12px;font-weight:600;margin-bottom:5px;">Model ID</div>
              <input class="input-line mono" value="gpt-6-luna" />
            </div>
          </div>
          <div style="display:flex;justify-content:flex-end;gap:8px;padding-top:6px;">
            <button class="btn">仅保存配置</button>
            <button class="btn btn-primary">保存并校验</button>
          </div>
        </div>
      `;
    }

    function toggleTool(id) {
      const t = TOOLS.find(x => x.id === id);
      if (t) t.enabled = !t.enabled;
      render();
    }

    function switchPage(p) {
      document.querySelector(`.nav-item[data-page="${p}"]`)?.click();
    }

    render();
  </script>
</body>
</html>
