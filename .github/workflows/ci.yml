name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Check Markdown links
        run: python3 scripts/check-doc-links.py

      - name: Go vet
        run: go vet ./...

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Run Go tests
        run: CGO_ENABLED=0 go test -count=1 ./...

      - name: Run Go tests with race detector
        run: CGO_ENABLED=1 go test -race -count=1 ./internal/... ./cmd/...

      - name: Check package boundaries
        run: python3 scripts/check-foundation.py

      - name: Test stable channel
        run: CGO_ENABLED=0 go test -ldflags="-X gatewaylab/internal/buildinfo.channel=stable" ./...

      - name: Test release policy and worktree runtime
        run: node --test scripts/release-policy.test.mjs .agents/skills/git-workflow/scripts/worktree-runtime.test.mjs

      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # Daily CI cross-compiles on Linux. Signing, notarization and DMGs
      # remain in release.yml on macOS.
      - name: Cross-package macOS Dev and Stable apps (unsigned)
        run: |
          node scripts/build-channel.mjs package dev -platform darwin/arm64,darwin/amd64 -skip-dmg
          node scripts/build-channel.mjs package stable -platform darwin/arm64,darwin/amd64 -skip-dmg
          python3 scripts/verify-cross-packages.py

      - name: Archive unsigned Dev apps with executable permissions
        run: |
          for app in build/dev/*/*.app; do
            tar -czf "$(dirname "$app")/mcp-gateway-dev-unsigned.tar.gz" -C "$(dirname "$app")" "$(basename "$app")"
          done

      - name: Retain unsigned Dev builds for testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-gateway-dev-unsigned-${{ github.sha }}
          path: build/dev/*/*-unsigned.tar.gz
          if-no-files-found: error
