name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-package:
    name: Test & Desktop Package (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        run: cd web && npm ci && npm run build

      - name: Run Go tests
        run: CGO_ENABLED=0 go test -count=1 ./...

      - name: Test channel and release policy
        run: |
          node --test scripts/release-policy.test.mjs
          CGO_ENABLED=0 go test -ldflags="-X gatewaylab/internal/buildinfo.channel=stable" ./...

      - name: Verify desktop package build (ad-hoc)
        run: make package

      - name: Verify Stable package identity
        run: node scripts/build-channel.mjs package stable -skip-dmg

      - name: Archive Dev app with executable permissions
        run: |
          for app in build/dev/*/*.app; do
            ditto -c -k --sequesterRsrc --keepParent "$app" "$(dirname "$app")/mcp-gateway-dev.zip"
          done

      - name: Retain Dev build for testing
        uses: actions/upload-artifact@v4
        with:
          name: mcp-gateway-dev-${{ github.sha }}
          path: build/dev/*/*.zip
          if-no-files-found: error
