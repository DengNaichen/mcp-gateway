name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: ./internal/openapi, target: FuzzImportOpenAPI }
          - { package: ./internal/upstream, target: FuzzBuildMappedRequest }
          - { package: ./internal/registry, target: FuzzValidateMapping }
          - { package: ./internal/workspace, target: FuzzVerifyToken }
          - { package: ./internal/workspace, target: FuzzVerifyTokenMutation }
          - { package: ./internal/scope, target: FuzzResolveMCPToolCallScope }
          - { package: ./internal/maintenance, target: FuzzParseSourceSignal }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Fuzz
        run: go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=30s ${{ matrix.package }}

      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz/${{ matrix.target }}
          if-no-files-found: ignore
