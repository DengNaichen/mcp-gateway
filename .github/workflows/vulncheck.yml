name: Vulncheck

# New advisories land without code changes, so scan daily; PRs and pushes
# only scan when dependencies change.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - go.mod
      - go.sum
      - .github/workflows/vulncheck.yml
  push:
    branches:
      - main
    paths:
      - go.mod
      - go.sum

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
