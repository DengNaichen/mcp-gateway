name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      git_ref:
        description: Existing version tag to build (published releases cannot be overwritten)
        required: true
        default: ""
        type: string
      platform:
        description: MyGo target platforms (comma-separated)
        required: false
        default: darwin/arm64,darwin/amd64
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  draft-release:
    name: Prepare Draft Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Verify version and tag
        id: meta
        run: |
          VERSION="$(node -p 'require("./internal/buildinfo/profiles.json").version')"
          TAG="v${VERSION}"
          if [[ "${{ github.event_name }}" == "push" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION in profiles.json (expected $TAG)"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Reject published releases and mismatched tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-policy.mjs

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Draft release $TAG already exists; continuing verified tag build."
            exit 0
          fi

          args=(
            "$TAG"
            --repo "$GITHUB_REPOSITORY"
            --draft
            --title "$TAG"
            --generate-notes
          )
          if [[ "${{ github.event_name }}" == "push" ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}"

  build:
    name: macOS (${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'darwin/arm64,darwin/amd64' }})
    needs: draft-release
    runs-on: macos-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      uploaded: ${{ steps.build.outputs.uploaded }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Run Go tests
        run: CGO_ENABLED=0 go test -count=1 ./...

      - name: Import Developer ID certificate and notary credentials
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          missing=()
          [[ -z "$MACOS_CERTIFICATE" ]] && missing+=("MACOS_CERTIFICATE")
          [[ -z "$MACOS_CERTIFICATE_PASSWORD" ]] && missing+=("MACOS_CERTIFICATE_PASSWORD")
          [[ -z "$MACOS_SIGNING_IDENTITY" ]] && missing+=("MACOS_SIGNING_IDENTITY")
          [[ -z "$APPLE_ID" ]] && missing+=("APPLE_ID")
          [[ -z "$APPLE_TEAM_ID" ]] && missing+=("APPLE_TEAM_ID")
          [[ -z "$APPLE_APP_PASSWORD" ]] && missing+=("APPLE_APP_PASSWORD")

          if (( ${#missing[@]} > 0 )); then
            echo "::warning::Missing macOS signing/notary secrets (${missing[*]}). Falling back to ad-hoc unsigned build; release will stay a draft."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          security find-identity -v -p codesigning "$keychain"
          xcrun notarytool store-credentials notary --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"

          {
            echo "NOTARY_KEYCHAIN=$keychain"
            echo "MACOS_NOTARY_PROFILE=notary"
            echo "MACOS_SIGNING_IDENTITY=$MACOS_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build and upload release artifacts
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || 'darwin/arm64,darwin/amd64' }}
        run: |
          if [[ -n "$MYGO_UPDATER_PRIVATE_KEY" ]]; then
            node scripts/build-channel.mjs package stable -platform "$PLATFORM" -upload
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Missing MYGO_UPDATER_PRIVATE_KEY secret. Building without -upload and updater manifests."
            node scripts/build-channel.mjs package stable -platform "$PLATFORM"
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release-${{ needs.draft-release.outputs.tag }}
          path: |
            build/stable/*/*.dmg
            build/stable/*/*.tar.gz
            build/stable/*/*.delta
            build/stable/*/update-*.json
            build/stable/*/install.sh
            build/stable/SHA256SUMS
          if-no-files-found: warn

      - name: Clean up temporary keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [[ -n "${NOTARY_KEYCHAIN:-}" ]]; then
            security delete-keychain "$NOTARY_KEYCHAIN" || true
          fi

  publish:
    name: Publish Release
    needs: [draft-release, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.build.outputs.signed == 'true' && needs.build.outputs.uploaded == 'true'
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.draft-release.outputs.tag }}"
          VERSION="${{ needs.draft-release.outputs.version }}"
          args=("$TAG" --repo "$GITHUB_REPOSITORY" --draft=false)
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release edit "${args[@]}"
